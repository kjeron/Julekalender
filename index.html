/* ==========================================================================
   Julekalenderen – juletivoli om natten
   Farger: natteblå bunn, lyspæregull, strikkerødt, granbar, ullhvit billettpapir.
   ========================================================================== */

:root {
  --natt: #1b1f4b;
  --natt-2: #262c66;
  --natt-3: #12153a;
  --natt-lys: #343b8a;
  --paere: #ffc93c;
  --paere-mork: #b88a12;
  --rod: #c8202a;
  --rod-mork: #8f141c;
  --gran: #1e6b45;
  --gran-mork: #124530;
  --ull: #f6eedf;
  --sno: #f5f7ff;
  --sno-dim: #b9bfe6;
  --display: 'Alfa Slab One', 'Rockwell', 'Roboto Slab', 'Georgia', serif;
  --tekst: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --topp: env(safe-area-inset-top, 0px);
  --bunn: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--natt);
  color: var(--sno);
  font: 16px/1.45 var(--tekst);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
/* stille snø i bakgrunnen (ingen bevegelse) */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 14% 12%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 72% 8%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.8px 1.8px at 38% 31%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 88% 37%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 6% 58%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 54% 66%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.7px 1.7px at 92% 82%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 26% 88%, rgba(255,255,255,.45), transparent 60%);
  background-size: 260px 300px;
  opacity: .7;
}

button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--paere); outline-offset: 3px; border-radius: 10px; }

.app {
  position: relative;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(10px + var(--topp)) 14px calc(24px + var(--bunn));
}

.skjult { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Knapper ------------------------------------------------------ */
.knapp {
  appearance: none;
  border: 0;
  border-radius: 999px;
  min-height: 52px;
  padding: 14px 26px;
  font: 700 17px/1.1 var(--tekst);
  background: var(--paere);
  color: var(--natt-3);
  box-shadow: 0 4px 0 var(--paere-mork);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s, box-shadow .08s, opacity .2s;
}
.knapp:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paere-mork); }
.knapp:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 0 4px 0 var(--paere-mork); }
.knapp--sekundar { background: transparent; color: var(--sno); box-shadow: inset 0 0 0 2px rgba(245,247,255,.55); }
.knapp--sekundar:active { box-shadow: inset 0 0 0 2px rgba(245,247,255,.55); }
.knapp--liten { min-height: 40px; padding: 9px 16px; font-size: 15px; }

.ikonknapp {
  appearance: none;
  border: 0;
  background: transparent;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--sno);
}
.ikonknapp svg { width: 24px; height: 24px; }

/* ---------- Bannere (test og demo) --------------------------------------- */
.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 2px 0 6px;
  padding: 10px 12px;
  border-radius: 12px;
  background: repeating-linear-gradient(-45deg, #ffc93c 0 14px, #f3b928 14px 28px);
  color: var(--natt-3);
  font-size: 14px;
  font-weight: 650;
  line-height: 1.3;
}
.banner .knapp { background: var(--natt-3); color: var(--sno); box-shadow: none; flex: none; }
.banner__knapper { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 52%; }

/* ---------- Skiltet med de to som titter fram ---------------------------- */
.skilt { position: relative; margin: 112px auto 0; max-width: 380px; }
.skilt__hoder {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  top: -136px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 26px;
  pointer-events: none;
}
.skilt__hoder .figur { height: 150px; width: auto; }
.skilt__hoder .figur:first-child { transform: rotate(-6deg); }
.skilt__hoder .figur:last-child { transform: rotate(6deg); }
.titt-inn .skilt__hoder .figur { animation: tittOpp .9s cubic-bezier(.2,1.4,.4,1) both; }
.titt-inn .skilt__hoder .figur:last-child { animation-delay: .18s; }
@keyframes tittOpp { from { translate: 0 70px; } to { translate: 0 0; } }

.skilt__tavle {
  position: relative;
  z-index: 2;
  padding: 16px 16px 15px;
  border-radius: 18px;
  background: var(--rod);
  box-shadow: inset 0 0 0 3px rgba(255, 201, 60, .6), inset 0 0 0 7px var(--rod), inset 0 0 0 8px rgba(255, 201, 60, .25), 0 6px 0 var(--natt-3);
  text-align: center;
}
.skilt__tavle h1 {
  margin: 0;
  font: 400 clamp(30px, 9.2vw, 44px)/1 var(--display);
  letter-spacing: .01em;
  color: var(--sno);
  text-shadow: 0 3px 0 var(--rod-mork);
}
.skilt__tavle h1 span { display: block; }
.skilt__familie { font-size: clamp(19px, 5.6vw, 26px); line-height: 1.1; margin-bottom: 4px; text-shadow: 0 2px 0 var(--rod-mork); }

.hilsen { margin: 16px 2px 0; font-size: 17px; }
.hilsen strong { font-weight: 700; }
.hilsen .sum { font: 400 19px/1 var(--display); color: var(--paere); white-space: nowrap; }
.melding { margin: 4px 2px 0; color: var(--sno-dim); font-size: 15px; }

/* ---------- Lukene ------------------------------------------------------- */
.luker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 16px;
}
.luke {
  --dor: var(--rod);
  position: relative;
  aspect-ratio: 4 / 5;
  border: 0;
  border-radius: 10px;
  padding: 0;
  background: var(--dor);
  color: var(--sno);
  font: 400 clamp(19px, 6vw, 27px)/1 var(--display);
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: inset 0 0 0 2px rgba(255, 201, 60, .34), inset 0 -6px 0 rgba(0, 0, 0, .2), 0 4px 0 var(--natt-3);
  transition: transform .12s;
}
.luke::after { /* dørhåndtak */
  content: '';
  position: absolute;
  right: 9%;
  top: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 201, 60, .7);
}
.luke:active { transform: translateY(2px); }
.luke--24 { grid-column: span 2; aspect-ratio: auto; font-size: clamp(26px, 8vw, 36px); }
.luke[data-farge='gran'] { --dor: var(--gran); }
.luke[data-farge='natt'] { --dor: var(--natt-lys); }
.luke--last { filter: saturate(.5) brightness(.72); }
.luke--last::after { opacity: .4; }

.luke--idag { z-index: 2; transform: translateY(-2px); box-shadow: inset 0 0 0 2px rgba(255, 201, 60, .7), inset 0 -6px 0 rgba(0, 0, 0, .2), 0 0 22px rgba(255, 201, 60, .45), 0 6px 0 var(--natt-3); }
.luke .lys { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; overflow: visible; }
.lys .av { stroke: #8a6a1c; }
.lys .pa { stroke: var(--paere); filter: drop-shadow(0 0 3px rgba(255, 201, 60, .95)); animation: jage .9s steps(3) infinite; }
@keyframes jage { to { stroke-dashoffset: var(--periode); } }

.merke {
  position: absolute;
  left: 50%;
  bottom: 6%;
  translate: -50% 0;
  padding: 2px 6px 3px;
  border-radius: 6px;
  background: var(--paere);
  color: var(--natt-3);
  font: 700 10px/1 var(--tekst);
  white-space: nowrap;
}

.luke--apnet { background: var(--natt-3); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08), 0 4px 0 #0b0d26; }
.luke--apnet::after { display: none; }
.luke__nr { position: absolute; left: 7px; top: 6px; font: 400 12px/1 var(--display); color: var(--sno-dim); }
.stubb {
  position: absolute;
  inset: 26% 10% 12%;
  display: grid;
  place-items: center;
  align-content: center;
  border-radius: 6px;
  background: var(--ull);
  color: var(--natt-3);
  -webkit-mask: radial-gradient(circle 5px at 0 50%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 5px at 0 50%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 97%, #000) right / 51% 100% no-repeat;
}
.stubb b { font: 400 clamp(15px, 4.6vw, 22px)/1 var(--display); }
.stubb small { font: 700 10px/1.2 var(--tekst); opacity: .7; }
.luke--24 .stubb { inset: 24% 18% 12%; }

.fot { margin: 22px 2px 0; color: var(--sno-dim); font-size: 13px; text-align: center; }

/* ---------- «Ikke ennå» og andre små beskjeder --------------------------- */
.beskjed {
  position: fixed;
  inset: auto 0 0;
  z-index: 40;
  display: flex;
  justify-content: center;
  pointer-events: none;
}
.beskjed__innhold { position: relative; width: min(420px, 100%); height: 300px; pointer-events: auto; }
.beskjed .figur { position: absolute; left: 50%; bottom: -12px; height: 270px; width: auto; translate: -64% 0; animation: reisSeg .55s cubic-bezier(.2,1.3,.4,1) both; }
.beskjed .snakkeboble { position: absolute; right: 12px; top: 6px; max-width: 200px; animation: boble .4s .25s cubic-bezier(.2,1.4,.4,1) both; }
.beskjed.borte .figur { animation: synk .35s ease-in both; }
.beskjed.borte .snakkeboble { animation: boble .2s reverse both; }
@keyframes reisSeg { from { transform: translateY(110%); } to { transform: translateY(0); } }
@keyframes synk { to { transform: translateY(115%); } }
@keyframes boble { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.snakkeboble {
  position: relative;
  padding: 12px 14px;
  border-radius: 16px;
  background: #fff;
  color: var(--natt-3);
  font: 700 16px/1.3 var(--tekst);
  box-shadow: 0 4px 0 rgba(0, 0, 0, .25);

}
.snakkeboble::after {
  content: '';

  bottom: -10px;
  border: 10px solid transparent;
  border-top-color: #fff;
  border-bottom: 0;
}
.snakkeboble--hoyre::after { left: auto; right: 22px; }

/* ---------- Spillskjermen ------------------------------------------------ */
.spillskjerm { display: flex; flex-direction: column; min-height: calc(100dvh - 34px - var(--topp) - var(--bunn)); }
.topplinje { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px; }
.tilbake {
  appearance: none;
  border: 0;
  background: transparent;

  align-items: center;
  gap: 4px;
  padding: 10px 8px;
  border-radius: 12px;
  font-weight: 650;
  cursor: pointer;
}
.tilbake svg { width: 22px; height: 22px; }
.lukeetikett { font: 400 15px/1 var(--display); color: var(--paere); }
.spill-tittel { margin: 2px 0 0; font: 400 clamp(26px, 8vw, 34px)/1.05 var(--display); }
.spill-tekst { margin: 6px 0 0; color: var(--sno-dim); min-height: 1.45em; }
.scene { position: relative; flex: 1; display: grid; place-items: center; margin-top: 10px; min-height: 300px; }
.handling { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 14px 0 6px; min-height: 72px; }

.figur { overflow: visible; display: block; }

.figur .arm-v { transform-origin: 62px 172px; }
.figur .arm-h { transform-origin: 138px 172px; }
.figur .kvist.arm-v { transform-origin: 58px 200px; }
.figur .kvist.arm-h { transform-origin: 142px 200px; }
.figur .hode { transform-box: view-box; transform-origin: 100px 160px; }
.figur.jubel .arm-v { transform: rotate(150deg); }
.figur.jubel .arm-h { transform: rotate(-150deg); }

.figur.jubel .kvist.arm-h { transform: rotate(-60deg); }
.figur.jubel { animation: hopp .5s .1s ease-in-out 3; }
.figur.vink .arm-h { animation: vink .8s ease-in-out infinite; }
.figur.dupp { animation: dupp 1.2s ease-in-out infinite; }
.figur .glorie { animation: sveve 2.4s ease-in-out infinite; }
@keyframes hopp { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12%; } }
@keyframes vink { 0%, 100% { transform: rotate(-125deg); } 50% { transform: rotate(-165deg); } }
@keyframes dupp { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3%; } }
@keyframes sveve { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ---------- Gevinstbilletten -------------------------------------------- */
.avsloring {
  position: fixed;

  place-items: center;
  padding: 20px 16px calc(20px + var(--bunn));

}
@keyframes fadeInn { from { opacity: 0; } }
.automat { position: relative; width: min(330px, 86vw); }
.automat__spalte {
  position: relative;
  z-index: 3;
  height: 20px;
  margin: 0 -8px;
  border-radius: 10px;

  -webkit-mask: radial-gradient(circle 11px at 0 62%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 11px at 100% 62%, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 11px at 0 62%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 11px at 100% 62%, transparent 97%, #000) right / 51% 100% no-repeat;

.billett::before { /* perforering */

  position: absolute;
  left: 18px;
  right: 18px;

  border-top: 2px dashed rgba(18, 21, 58, .25);
}
.billett.skriver { animation: skriv .5s ease-in-out infinite; }
@keyframes skriv { 50% { translate: 1px 0; } }
.billett__luke { margin: 0; font: 700 13px/1 var(--tekst); opacity: .65; }

.billett__info { margin: 26px 0 0; font-size: 14px; line-height: 1.35; }

.avsloring .handling { padding-top: 22px; }
.med-cameo { padding-top: 200px; }
.cameo-ramme { position: absolute; z-index: 1; left: -20%; right: -20%; bottom: calc(100% - 12px); height: 250px; overflow: hidden; pointer-events: none; display: flex; justify-content: center; align-items: flex-end; }
.cameo-ramme .cameo { height: 230px; width: auto; animation: cameo .7s cubic-bezier(.2,1.3,.4,1) both; }
.cameo-ramme .figur-drakt.cameo { height: 250px; margin-bottom: -40px; }
.cameo-boble { position: absolute; z-index: 4; right: -6px; bottom: calc(100% + 150px); animation: boble .35s .45s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes cameo { from { transform: translateY(105%); } to { transform: none; } }

.konfetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

/* ---------- Laster og feil ---------------------------------------------- */
.senter { min-height: 80vh; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 20px; }
.senter h1 { margin: 0; font: 400 28px/1.1 var(--display); }

.senter .figur { height: 210px; width: auto; }
.lasteprikker { display: flex; gap: 8px; }
.lasteprikker i { width: 12px; height: 12px; border-radius: 50%; background: var(--paere); animation: blink 1s infinite; }
.lasteprikker i:nth-child(2) { animation-delay: .2s; }
.lasteprikker i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

@media (max-height: 700px) {

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .lys .pa { animation: none; }
}

/* ==========================================================================
   Spillene
   ========================================================================== */

@keyframes pop { from { transform: scale(.3); } to { transform: none; } }
@keyframes hoppe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ---------- Lykkehjul ---------------------------------------------------- */
.hjul { position: relative; width: min(340px, 94vw); padding-bottom: 86px; }
.hjul__ramme { position: relative; width: min(300px, 80vw, calc(100vh - 380px)); width: min(300px, 80vw, calc(100dvh - 380px)); margin: 0 auto; aspect-ratio: 1; }

.hjul__nav { position: absolute; left: 38%; top: 38%; width: 24%; pointer-events: none; }
.hjul__peker { position: absolute; left: 43%; top: -6%; width: 14%; transform-origin: 50% 12%; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); pointer-events: none; }
.vert { position: absolute; bottom: 0; width: 112px; height: auto; z-index: 3; }

/* ---------- Skrapelodd -------------------------------------------------- */
.lodd { position: relative; width: min(320px, 90vw, calc(100vh - 400px)); width: min(320px, 90vw, calc(100dvh - 400px)); padding-top: 88px; }
.lodd__titter { position: absolute; top: 0; left: calc(50% - 85px); width: 170px; height: 88px; }
.lodd__titter .figur { position: absolute; z-index: 1; left: 50%; top: -42px; height: 152px; width: auto; translate: -50% 0; transition: transform .45s cubic-bezier(.2,1.5,.4,1); }
.lodd__titter.jubel .figur { transform: translateY(-26px); }
.vott { position: absolute; z-index: 3; bottom: -6px; width: 36px; height: 28px; border-radius: 16px 16px 10px 10px; background: var(--rod); border: 2.6px solid #231a1a; box-shadow: inset 0 -5px 0 var(--rod-mork); }
.vott::before { content: ''; position: absolute; top: -9px; width: 13px; height: 16px; border-radius: 8px; background: var(--rod); border: 2.6px solid #231a1a; border-bottom: 0; }
.vott--v { left: 4px; }
.vott--v::before { left: 2px; }
.vott--h { right: 4px; }
.vott--h::before { right: 2px; }
.lodd__titter.jubel .vott { animation: hoppe .45s ease-in-out 3; }
.lodd__boble { position: absolute; z-index: 4; left: 76%; top: -46px; white-space: nowrap; animation: boble .35s cubic-bezier(.2,1.4,.4,1) both; }
.lodd__kort { position: relative; z-index: 2; padding: 12px; border-radius: 18px; background: var(--ull); color: var(--natt-3); border: 3px solid #231a1a; box-shadow: 0 8px 0 rgba(0, 0, 0, .28); }
.lodd__topp { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 4px 10px; }
.lodd__navn { font: 400 24px/1 var(--display); color: var(--rod); }
.lodd__regel { font-size: 13px; font-weight: 700; }
.lodd__omraade { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid rgba(18, 21, 58, .25); }
.lodd__felt { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); background: #fff; }
.felt { display: grid; place-items: center; border: 1px dashed rgba(18, 21, 58, .14); overflow: hidden; }
.felt .symbol { font-size: clamp(30px, 10vw, 44px); line-height: 1; }
.felt .figur.symbol--ansikt { width: 82%; height: auto; }
.felt.avdekket > * { animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
.felt.vinner { background: #fff1c2; box-shadow: inset 0 0 0 3px var(--paere); }
.felt.vinner > * { animation: hoppe .6s ease-in-out infinite; }

.lodd__belegg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.lodd__bunn { margin-top: 8px; text-align: center; font-size: 11px; opacity: .55; }

/* ---------- Enarmet banditt -------------------------------------------- */
.banditt { position: relative; display: flex; align-items: flex-end; padding-left: 64px; }

.banditt__skilt { margin-bottom: 12px; padding: 10px 6px; border-radius: 16px; background: var(--natt-3); border: 3px solid #231a1a; text-align: center; }
.banditt__skilt span { font: 400 clamp(16px, 5.4vw, 21px)/1 var(--display); color: var(--paere); }
.blinker .banditt__skilt span { animation: blinke .25s steps(2) infinite; }
.banditt__vindu { --h: clamp(58px, 16.5vw, 68px); position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; height: calc(var(--h) * 3 + 6px); padding: 3px; border-radius: 12px; background: #231a1a; overflow: hidden; }
.valse { position: relative; overflow: hidden; border-radius: 7px; background: var(--ull); }
.valse::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(0, 0, 0, .38), transparent 28%, transparent 72%, rgba(0, 0, 0, .38)); }
.stripe { will-change: transform; }

.banditt__linje { position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: var(--paere); box-shadow: 0 0 6px var(--paere); opacity: .75; pointer-events: none; }
.banditt__vindu.gevinst .banditt__linje { height: 5px; margin-top: -2.5px; opacity: 1; animation: blinke .2s steps(2) infinite; }
.banditt__panel { display: flex; justify-content: center; gap: 14px; margin: 12px 0 10px; }
.lampe { width: 16px; height: 16px; border-radius: 50%; background: #6b4e12; border: 2px solid #231a1a; }
.blinker .lampe { background: var(--paere); animation: blinke .3s steps(2) infinite; }
.blinker .lampe:nth-child(2) { animation-delay: .15s; }
.banditt__brett { position: relative; height: 34px; border-radius: 10px; background: var(--natt-3); border: 3px solid #231a1a; }
.mynt { position: absolute; top: -24px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 2px solid #231a1a; background: radial-gradient(circle at 35% 35%, #fff2b0, var(--paere) 55%, var(--paere-mork)); animation: myntfall .55s cubic-bezier(.5, 0, .8, .4) both; }
@keyframes myntfall { from { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(30px); } }
.banditt__spak { position: relative; width: 36px; height: 220px; margin-left: 2px; align-self: center; }
.spak__fot { position: absolute; left: 0; bottom: 40px; width: 24px; height: 50px; border-radius: 8px; background: #8d929e; border: 3px solid #231a1a; }
.spak__stang { position: absolute; left: 7px; bottom: 70px; width: 11px; height: 130px; border-radius: 6px; background: linear-gradient(90deg, #e2e5ec, #9aa0ad); border: 2.5px solid #231a1a; }
.spak__kule { position: absolute; left: 50%; top: -24px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8080, var(--rod) 60%, var(--rod-mork)); border: 3px solid #231a1a; cursor: grab; touch-action: none; transform: translateY(var(--dra, 0px)); transition: transform .25s; }
.banditt__spak.dratt .spak__kule { transform: translateY(80px); transition-duration: .12s; }

/* ---------- Velg en pakke ---------------------------------------------- */
.pakker { position: relative; width: min(340px, 94vw); height: 250px; }
.pakke { position: absolute; left: 50%; bottom: 24px; width: 30%; margin-left: -15%; padding: 0; border: 0; background: none; cursor: pointer; transition: opacity .4s, filter .4s; }

.pakke .pakke__lokk { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .55s cubic-bezier(.2,1.4,.4,1); }
.pakke.apnet .pakke__lokk { transform: translate(-34px, -86px) rotate(-38deg); }
.klovn { position: absolute; left: 50%; bottom: 66%; width: 92%; margin-left: -46%; pointer-events: none; }
.klovn__hode { position: relative; transform-origin: 50% 100%; animation: klovnhode .7s cubic-bezier(.2,1.8,.4,1) both, vippe 1.4s .7s ease-in-out infinite; }
.klovn__hode .figur { width: 100%; height: auto; }
.klovn__fjaer { width: 26%; height: 64px; margin: -6px auto 0; transform-origin: 50% 100%; animation: fjaer .7s cubic-bezier(.2,1.8,.4,1) both; }
.klovn__fjaer svg { display: block; width: 100%; height: 100%; }
.klovn__boble { position: absolute; left: 72%; top: -10px; white-space: nowrap; animation: boble .35s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes fjaer { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes klovnhode { from { transform: translateY(80px) scale(.3); } to { transform: none; } }
@keyframes vippe { 0%, 100% { rotate: -6deg; } 50% { rotate: 6deg; } }

/* ---------- Plinko ----------------------------------------------------- */
.plinko { position: relative; width: min(316px, 86vw, calc((100vh - 350px) * .708)); width: min(316px, 86vw, calc((100dvh - 350px) * .708)); }
.plinko__brett { display: block; width: 100%; touch-action: none; filter: drop-shadow(0 8px 0 rgba(0, 0, 0, .3)); }
.plinko .pinne { fill: #c9cff5; }
.plinko .pinne.truffet { animation: pinne .45s ease-out; }
@keyframes pinne { 0% { fill: #ffffff; } 100% { fill: #c9cff5; } }
.plinko .spor { fill: #181d4d; }
.plinko .spor--gevinst { fill: #3e3212; }
.plinko .spor.lyser { fill: var(--paere); animation: blinke .3s steps(2) 6; }
.spor__nitte { fill: #6f76b8; font: 700 22px var(--tekst); text-anchor: middle; }
.plinko { margin-top: 86px; }
.plinko__brett { position: relative; z-index: 2; }
.plinko__titter { position: absolute; z-index: 1; right: 4px; top: -98px; width: 84px; transform-origin: 50% 100%; }
.plinko__titter .figur { width: 100%; height: auto; }
.plinko__titter .figur { transition: transform .45s cubic-bezier(.2,1.5,.4,1); }
.plinko__titter.jubel .figur { transform: translateY(-22px); }
.plinko__boble { position: absolute; z-index: 3; right: 86%; bottom: 72%; white-space: nowrap; animation: boble .35s cubic-bezier(.2,1.4,.4,1) both; }

/* ---------- Reinsdyrløp ------------------------------------------------ */
.scene--reinsdyr { place-items: stretch; align-content: center; }
.lop { position: relative; width: 100%; }
.lop__bane { position: relative; display: grid; gap: 8px; }
.lop__mal { position: absolute; z-index: 2; top: -4px; bottom: -4px; right: 14px; width: 12px; border-radius: 3px; background: repeating-conic-gradient(#fff 0 25%, #231a1a 0 50%) 0 0 / 12px 12px; pointer-events: none; }
.lop .spor { position: relative; display: block; width: 100%; height: 96px; padding: 0; border: 0; border-radius: 14px; background: linear-gradient(#eef2fd, #cdd6f3); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); color: var(--natt-3); text-align: left; cursor: pointer; }
.lop .spor.valgt { box-shadow: inset 0 0 0 3px var(--paere), 0 0 0 3px var(--paere); }
.lop .spor.vinner { box-shadow: inset 0 0 0 3px var(--paere), 0 0 20px var(--paere); }
.spor__navn { position: absolute; z-index: 0; left: 116px; top: 50%; translate: 0 -50%; font: 700 15px/1 var(--tekst); }
.spor__navn b { font: 400 16px/1 var(--display); color: var(--rod); }
.ekvipasje { position: absolute; z-index: 1; left: 2px; bottom: 3px; width: 104px; height: 92px; will-change: transform; }
.ekvipasje .rytter { position: absolute; left: 20px; bottom: 33px; width: 54px; height: auto; }
.rein-holder { position: absolute; left: 0; right: 0; bottom: 0; }
.rein { display: block; width: 104px; height: auto; overflow: visible; }
.lop.i-gang .ben { animation: galopp .3s ease-in-out infinite alternate; }
.lop.i-gang .ben-f2, .lop.i-gang .ben-b1 { animation-delay: -.15s; }
@keyframes galopp { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
.lop.i-gang .rytter { animation: ri .3s ease-in-out infinite alternate; }
@keyframes ri { to { translate: 0 -3px; } }
.lop__nedtelling { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; font: 400 68px/1 var(--display); color: var(--paere); text-shadow: 0 4px 0 var(--natt-3); pointer-events: none; }
.lop__nedtelling.vis { animation: tellepop .6s ease-out both; }
@keyframes tellepop { from { transform: scale(2); opacity: 0; } 30% { transform: scale(1); opacity: 1; } to { opacity: 0; } }
.lop__blits { position: absolute; inset: -8px; z-index: 5; border-radius: 18px; background: #fff; opacity: 0; pointer-events: none; }
.lop__blits.blink { animation: blits .55s ease-out; }
@keyframes blits { from { opacity: .9; } to { opacity: 0; } }
.malfoto { position: absolute; z-index: 3; right: 34px; top: 8px; padding: 4px 8px; border-radius: 6px; background: var(--rod); color: #fff; font: 700 12px/1 var(--tekst); rotate: -6deg; animation: stempel .4s both; }

/* ---------- Memory ----------------------------------------------------- */
.memory { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(330px, 90vw, calc((100vh - 250px) * .68)); width: min(330px, 90vw, calc((100dvh - 250px) * .68)); }
.kort { aspect-ratio: 1 / 1.1; padding: 0; border: 0; background: none; perspective: 700px; cursor: pointer; }
.kort__inner { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,1.3,.5,1); }
.kort.snudd .kort__inner, .kort.funnet .kort__inner { transform: rotateY(180deg); }
.kort__bak, .kort__forside { position: absolute; inset: 0; border-radius: 12px; border: 3px solid #231a1a; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.kort__bak { background: radial-gradient(circle, var(--paere) 0 8px, #231a1a 8.5px 10.5px, transparent 11px), repeating-linear-gradient(45deg, var(--rod) 0 9px, #ad1822 9px 18px); box-shadow: inset 0 0 0 3px rgba(255, 201, 60, .55); }
.kort__forside { display: grid; place-items: center; background: var(--ull); transform: rotateY(180deg); overflow: hidden; }
.kort__forside .figur { width: 88%; height: auto; }
.kort__forside .symbol { font-size: clamp(34px, 11vw, 46px); line-height: 1; }
.kort.funnet .kort__forside { background: #fff1c2; box-shadow: inset 0 0 0 3px var(--paere); }
.kort.bolge { animation: hoppe .45s ease-in-out 2; }

/* ---------- Pakkeåpning ------------------------------------------------ */
.storgave { position: relative; width: min(270px, 74vw); aspect-ratio: 1; margin-top: 60px; touch-action: none; -webkit-user-select: none; user-select: none; }
.indre { position: absolute; z-index: 2; inset: 6% 5% 0; }
.indre__kropp { position: absolute; inset: 24% 0 0; border-radius: 10px; background: linear-gradient(#ffd25a, #e9a91c); border: 3px solid #231a1a; box-shadow: inset 0 -10px 0 rgba(0, 0, 0, .12); }
.indre__lokk { position: absolute; left: -5%; right: -5%; top: 12%; height: 17%; border-radius: 8px; background: #f7c84a; border: 3px solid #231a1a; transform-origin: 8% 100%; transition: transform .6s cubic-bezier(.2,1.4,.4,1); }
.storgave.apnet .indre__lokk { transform: translate(-30%, -330%) rotate(-28deg); opacity: 0; transition: transform .7s cubic-bezier(.2,.8,.4,1), opacity .5s .25s; }
.papir { position: absolute; z-index: 3; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
.bit { background-color: var(--rod); background-image: radial-gradient(circle, rgba(255, 201, 60, .95) 0 3px, transparent 3.6px), repeating-linear-gradient(135deg, transparent 0 16px, rgba(255, 255, 255, .16) 16px 22px); background-size: 26px 26px, auto; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); transition: transform .7s cubic-bezier(.2,.7,.4,1), opacity .7s; }
.bit.revet { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.7); opacity: 0; pointer-events: none; }
.band { position: absolute; z-index: 4; background: var(--paere); border: 2.5px solid #231a1a; transition: transform .6s, opacity .6s; pointer-events: none; }
.band--v { left: 44%; width: 12%; top: 0; bottom: 0; }
.band--h { top: 44%; height: 12%; left: 0; right: 0; }
.storgave.band-borte .band--v { transform: translateY(-120%) rotate(14deg); opacity: 0; }
.storgave.band-borte .band--h { transform: translateX(120%) rotate(-10deg); opacity: 0; }
.storsloyfe { position: absolute; z-index: 5; left: 24%; top: -15%; width: 52%; transition: transform .6s cubic-bezier(.3,1.4,.5,1), opacity .6s; pointer-events: none; }
.storsloyfe svg { display: block; width: 100%; overflow: visible; }
.storgave.band-borte .storsloyfe { transform: translateY(-150%) rotate(-30deg); opacity: 0; }
.utspring { position: absolute; z-index: 1; left: 0; right: 0; top: 30%; height: 0; }
.spretter { position: absolute; bottom: -80px; width: 42%; height: auto; animation: sprett .8s cubic-bezier(.2,1.5,.4,1) both; }
.spretter--v { left: 3%; }
.spretter--h { right: 3%; animation-delay: .15s; }
@keyframes sprett { from { transform: translateY(60%) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.julebanner { position: absolute; z-index: 6; left: 50%; top: 56%; translate: -50% 0; padding: 8px 16px; border-radius: 10px; background: var(--paere); color: var(--rod-mork); border: 3px solid #231a1a; font: 400 26px/1 var(--display); white-space: nowrap; animation: boble .5s .5s cubic-bezier(.2,1.6,.4,1) both; }

</style>

/* ---------- Små hjelpere ------------------------------------------------- */
function el(tag, attrs, ...barn) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v === null || v === undefined) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
      else e.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const b of barn.flat()) if (b !== null && b !== undefined && b !== false) e.append(b);
  return e;
}
const vent = (ms) => new Promise((r) => setTimeout(r, ms));
const tilfeldig = (a, b) => a + Math.random() * (b - a);
const velg = (arr) => arr[Math.floor(Math.random() * arr.length)];
const begrens = (v, a, b) => Math.max(a, Math.min(b, v));
function stokk(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const svgNs = 'http://www.w3.org/2000/svg';

const ease = {
  utKubisk: (t) => 1 - Math.pow(1 - t, 3),
  utKvint: (t) => 1 - Math.pow(1 - t, 5),
  innUt: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  utTilbake: (t) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};

/** Kjører en animasjon med requestAnimationFrame. steg(e, t) får verdi etter easing og rå tid (0–1). */
function animer(varighet, steg, easing = (t) => t) {
  return new Promise((res) => {
    const t0 = performance.now();
    function ramme(n) {
      const t = Math.min(1, (n - t0) / varighet);
      steg(easing(t), t);
      if (t < 1) requestAnimationFrame(ramme); else res();
    }
    requestAnimationFrame(ramme);
  });
}

const Lager = {
  hent(k, standard) { try { const v = localStorage.getItem(k); return v === null ? standard : JSON.parse(v); } catch (e) { return standard; } },

};

const Lyd = {
  ctx: null,
  pa: Lager.hent('julekalender.lyd', true),
  start() {
    if (!this.pa) return null;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  sett(pa) { this.pa = pa; Lager.sett('julekalender.lyd', pa); if (pa) this.start(); },
  tone(freq, varighet = 0.12, type = 'sine', volum = 0.12, nar = 0, glid = 0) {
    const c = this.start();
    if (!c) return;
    const t = c.currentTime + nar;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (glid) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + glid), t + varighet);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(volum, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + varighet);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + varighet + 0.02);
  },
  stoy(varighet = 0.08, volum = 0.08, frekvens = 1800, nar = 0) {
    const c = this.start();
    if (!c) return;
    const t = c.currentTime + nar;
    const len = Math.floor(c.sampleRate * varighet);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = frekvens;
    const g = c.createGain();
    g.gain.value = volum;
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
  },
  tikk() { this.tone(1900, 0.03, 'square', 0.035); },
  klonk() { this.tone(170, 0.11, 'triangle', 0.16, 0, -60); },
  pop() { this.tone(520, 0.09, 'sine', 0.14, 0, 380); },
  boing() { this.tone(180, 0.35, 'sine', 0.16, 0, 420); this.tone(260, 0.25, 'triangle', 0.05, 0.05, 300); },
  riv() { this.stoy(0.13, 0.22, 2400); },
  skrap() { this.stoy(0.05, 0.05, 3200); },
  mynt(nar = 0) { this.tone(1568, 0.08, 'square', 0.04, nar); this.tone(2093, 0.16, 'square', 0.035, nar + 0.06); },
  vinn() {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
      this.tone(f, 0.5, 'sine', 0.11, i * 0.09);
      this.tone(f * 2, 0.25, 'triangle', 0.025, i * 0.09);
    });
  },
  telle() { this.tone(1200 + Math.random() * 300, 0.035, 'triangle', 0.05); },
};

/* ---------- Konfetti ------------------------------------------------------ */
function konfetti(antall = 160) {
  if (REDUSERT) antall = 40;
  const c = el('canvas', { class: 'konfetti' });
  document.body.append(c);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth;
  const H = window.innerHeight;
  c.width = W * dpr;
  c.height = H * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const farger = ['#ffc93c', '#c8202a', '#1e6b45', '#f5f7ff', '#f6eedf', '#e5525a'];
  const biter = Array.from({ length: antall }, () => ({
    x: W / 2 + tilfeldig(-40, 40),
    y: H * 0.42,
    vx: tilfeldig(-7, 7),
    vy: tilfeldig(-15, -5),
    r: tilfeldig(0, Math.PI * 2),
    vr: tilfeldig(-0.3, 0.3),
    w: tilfeldig(6, 11),
    h: tilfeldig(8, 15),
    f: velg(farger),
  }));
  const t0 = performance.now();
  return new Promise((res) => {
    function ramme(n) {
      const t = n - t0;
      x.clearRect(0, 0, W, H);
      biter.forEach((b) => {
        b.vy += 0.32;
        b.vx *= 0.99;
        b.x += b.vx;
        b.y += b.vy;
        b.r += b.vr;
        x.save();
        x.translate(b.x, b.y);
        x.rotate(b.r);
        x.fillStyle = b.f;
        x.globalAlpha = Math.max(0, 1 - t / 3200);
        x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2)));
        x.restore();
      });
      if (t < 3200) requestAnimationFrame(ramme); else { c.remove(); res(); }
    }
    requestAnimationFrame(ramme);
  });
}

/* ---------- Kontakt med serveren ----------------------------------------- */
class ApiFeil extends Error {
  constructor(melding, kode) { super(melding); this.kode = kode || 'FEIL'; }
}

const FjernApi = {
  async kall(body) {
    const kontroll = new AbortController();
    const tidsavbrudd = setTimeout(() => kontroll.abort(), 25000);
    let data;
    try {
      // Vanlig tekst gir en «enkel» forespørsel uten CORS-forhåndssjekk (Apps Script støtter ikke den)
      const res = await fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: kontroll.signal });
      data = await res.json();
    } catch (e) {
      throw new ApiFeil('Får ikke kontakt med kalenderen. Sjekk at du er på nett, og prøv igjen.', 'NETT');
    } finally {
      clearTimeout(tidsavbrudd);
    }
    if (!data || !data.ok) throw new ApiFeil((data && data.error) || 'Noe gikk galt. Prøv igjen om litt.', data && data.code);
    return data;
  },
  status(k) { return this.kall({ action: 'status', k }); },
  aapne(k, day) { return this.kall({ action: 'open', k, day }); },
  nullstill(k, day) { return this.kall({ action: 'resetTest', k, day }); },
};

/* Demo: etterligner serveren i nettleseren, slik at siden kan prøves uten oppsett.
   ?dag=8 viser hvordan kalenderen ser ut for en deltaker 8. desember. */
const DemoApi = (() => {
  const BELOP = Array.from({ length: ANTALL }, (_, i) => (i + 1) * 5);
  const ROT = ['hjul', 'skrapelodd', 'banditt', 'velgpakke', 'plinko', 'reinsdyr', 'memory'];
  const KALENDER = Array.from({ length: ANTALL }, (_, i) => (i === ANTALL - 1 ? 'pakkeapning' : ROT[i % ROT.length]));
  const p = new URLSearchParams(location.search);
  const hashDag = /^#dag-(\d+)$/.exec(location.hash || '');
  const simDag = p.has('dag') ? begrens(parseInt(p.get('dag'), 10) || 0, 0, ANTALL)
    : (hashDag ? begrens(parseInt(hashDag[1], 10), 0, ANTALL) : null);
  const nokkel = `julekalender.demo.${simDag === null ? 'test' : 'dag' + simDag}`;
  // Samme regel som serveren: hver luke har et fast beløp, og julaften får det største
  function lagPlan(trekk) {
    const plan = Array(ANTALL).fill(null);
    const brukt = [];
    Object.entries(trekk).forEach(([d, t]) => { plan[d - 1] = t.amount; brukt.push(t.amount); });
    const maks = BELOP[BELOP.length - 1];
    if (plan[ANTALL - 1] === null && !brukt.includes(maks)) { plan[ANTALL - 1] = maks; brukt.push(maks); }
    const igjen = stokk(BELOP.filter((b) => !brukt.includes(b)));
    for (let i = 0; i < ANTALL; i++) if (plan[i] === null) plan[i] = igjen.pop();
    return plan;
  }
  let tilstand = Lager.hent(nokkel, null);
  if (!tilstand) {
    tilstand = { trekk: {}, plan: lagPlan({}) };
    if (simDag) { // fyll inn noen åpnede luker, men la et par stå til gode
      for (let d = 1; d < simDag; d++) if (d % 4 !== 2) tilstand.trekk[d] = { amount: tilstand.plan[d - 1], type: KALENDER[d - 1] };
    }
  }
  if (!Array.isArray(tilstand.plan) || tilstand.plan.length !== ANTALL) tilstand.plan = lagPlan(tilstand.trekk);
  const lagre = () => Lager.sett(nokkel, tilstand);
  function status() {
    const erTest = simDag === null;
    const openDay = erTest ? ANTALL : simDag;
    let total = 0;
    const days = KALENDER.map((type, i) => {
      const dag = i + 1;
      const t = tilstand.trekk[dag];
      if (t) total += t.amount;
      return { day: dag, type: t ? t.type : (erTest || dag <= openDay ? type : null), opened: !!t, amount: t ? t.amount : null };
    });
    return { ok: true, name: 'Demo', isTest: erTest, demo: true, year: 2026, openDay, beforeStart: !erTest && openDay === 0, closed: false, opensAt: 0, now: '2026-12-01 12:00', days, total };
  }
  return {
    async status() { await vent(200); return status(); },
    async aapne(k, day) {
      await vent(tilfeldig(450, 1100));
      if (!tilstand.trekk[day]) {
        if (simDag !== null && day > simDag) throw new ApiFeil(`Luke ${day} åpner ${day}. desember.`, 'IKKE_AAPEN');
        const brukt = Object.values(tilstand.trekk).map((t) => t.amount);
        let belop = tilstand.plan[day - 1];
        if (brukt.includes(belop)) belop = velg(BELOP.filter((b) => !brukt.includes(b)));
        tilstand.trekk[day] = { amount: belop, type: KALENDER[day - 1] };
        lagre();
      }
      const s = status();
      return { ok: true, day, amount: tilstand.trekk[day].amount, total: s.total, status: s };
    },
    async nullstill(k, day) {
      await vent(200);
      if (day) delete tilstand.trekk[day]; else tilstand.trekk = {};
      lagre();
      return status();
    },
  };
})();

function hattTransform(navn, x, y, w, rot) {
  return `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${(w / 100).toFixed(4)})`;
}

function hattBoks(navn, x, y, w, rot) {
  const [x1, y1, x2, y2] = HATTER[navn].boks;
  const k = w / 100;
  const c = Math.cos((rot * Math.PI) / 180);
  const s = Math.sin((rot * Math.PI) / 180);
  const pkt = [[x1, y1], [x2, y1], [x1, y2], [x2, y2]].map(([px, py]) => [x + k * (px * c - py * s), y + k * (px * s + py * c)]);
  return [Math.min(...pkt.map((p) => p[0])), Math.min(...pkt.map((p) => p[1])), Math.max(...pkt.map((p) => p[0])), Math.max(...pkt.map((p) => p[1]))];
}

function hattSvg(navn, x, y, w, rot) {
  if (!navn || !HATTER[navn]) return '';
  return `<g class="hatt hatt-${navn}" transform="${hattTransform(navn, x, y, w, rot)}">${HATTER[navn].svg}</g>`;
}

function neseSvg(x, y, r) {
  return `<g class="rodnese"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#e3242b" stroke="${FARGE.strek}" stroke-width="${(r * 0.18).toFixed(1)}"/>` +
    `<circle cx="${(x - r * 0.35).toFixed(1)}" cy="${(y - r * 0.38).toFixed(1)}" r="${(r * 0.3).toFixed(1)}" fill="#ff9a9a"/></g>`;
}
