SPILL.reinsdyr = {
  tittel: 'Reinsdyrløp',
  tekst: 'Velg reinsdyret ditt, og start løpet.',
  start(ctx) {
    const dag = ctx.dag;
    const deltakere = [
      { navn: 'Lynet', rytter: () => dagensFigur(dag, 'han') },
      { navn: 'Komet', rytter: () => dagensFigur(dag, 'hun') },
      { navn: 'Snøball', rytter: () => fjosnisseSvg(FARGE.rod) },
      { navn: 'Pepper', rytter: () => fjosnisseSvg('#6b6f7a') },
    ];
    const rekkefolge = stokk([0, 1, 2, 3]);
    const bane = el('div', { class: 'lop__bane' }, el('div', { class: 'lop__mal', 'aria-hidden': 'true' }));
    const spor = rekkefolge.map((i, plass) => {
      const d = deltakere[i];
      const rytter = d.rytter();
      rytter.classList.add('rytter');
      const ekvipasje = el('div', { class: 'ekvipasje' }, rytter, el('div', { class: 'rein-holder', html: reinsdyrSvg() }));
      const knapp = el('button', { class: 'spor', 'aria-pressed': 'false', 'aria-label': `Velg ${d.navn}` },
        el('span', { class: 'spor__navn' }, el('b', { text: String(plass + 1) }), ' ', d.navn), ekvipasje);
      bane.append(knapp);
      return { ...d, knapp, ekvipasje, rytter, x: 0 };
    });
    const nedtelling = el('div', { class: 'lop__nedtelling', 'aria-live': 'assertive' });
    const blits = el('div', { class: 'lop__blits' });
    const lop = el('div', { class: 'lop' }, bane, nedtelling, blits);
    ctx.scene.append(lop);

    let valgt = -1;
    let startet = false;
    let stoppet = false;
    const knapp = ctx.knapp('Start løpet', startLop);
    knapp.disabled = true;
    spor.forEach((s, i) => s.knapp.addEventListener('click', () => {
      if (startet) return;
      valgt = i;
      spor.forEach((t, j) => { t.knapp.classList.toggle('valgt', j === i); t.knapp.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
      knapp.disabled = false;
      ctx.tekst(`Du har valgt ${s.navn}. Klar?`);
      Lyd.tikk();
    }));

    function fartsprofil(sterkSlutt) {
      const v = Array.from({ length: 7 }, (_, k) => (sterkSlutt ? 0.8 + k * 0.07 : 1) * tilfeldig(0.78, 1.22));
      const N = 200;
      const P = [0];
      for (let n = 1; n <= N; n++) {
        const u = n / N;
        const f = u * (v.length - 1);
        const k = Math.min(v.length - 2, Math.floor(f));
        const t = (1 - Math.cos((f - k) * Math.PI)) / 2;
        P.push(P[n - 1] + v[k] * (1 - t) + v[k + 1] * t);
      }
      return P.map((p) => p / P[N]);
    }
    const hentP = (P, u) => {
      if (u >= 1) return 1;
      const f = u * (P.length - 1);
      const k = Math.floor(f);
      return P[k] + (P[k + 1] - P[k]) * (f - k);
    };

    async function startLop() {
      if (startet || valgt < 0) return;
      startet = true;
      knapp.disabled = true;
      Lyd.start();
      ctx.tekst('Gjør dere klare …');
      for (const t of ['3', '2', '1', 'Kjør!']) {
        nedtelling.textContent = t;
        nedtelling.classList.remove('vis');
        void nedtelling.offsetWidth;
        nedtelling.classList.add('vis');
        Lyd.tone(t === 'Kjør!' ? 880 : 520, 0.16, 'square', 0.06);
        await vent(REDUSERT ? 120 : 620);
        if (stoppet) return;
      }
      nedtelling.textContent = '';
      ctx.tekst('Løpet er i gang!');
      lop.classList.add('i-gang');
      const varighet = REDUSERT ? 1.8 : 6.4;
      const tider = spor.map(() => varighet + tilfeldig(0, 0.7));
      const profiler = spor.map(() => fartsprofil(false));
      const andre = tider.filter((_, i) => i !== valgt);
      tider[valgt] = Math.min(...andre) - 0.07;
      // Den valgte skal ikke lede halvveis – spenningen skal vare
      for (let forsok = 0; forsok < 60; forsok++) {
        const p = fartsprofil(true);
        const midt = hentP(p, (varighet / 2) / tider[valgt]);
        const best = Math.max(...spor.map((_, i) => (i === valgt ? 0 : hentP(profiler[i], (varighet / 2) / tider[i]))));
        profiler[valgt] = p;
        if (midt < best) break;
      }
      const sporBredde = bane.clientWidth;
      const ekvB = spor[0].ekvipasje.offsetWidth;
      const malX = sporBredde - 26 - ekvB;
      const t0 = performance.now();
      let malfoto = false;
      await new Promise((ferdig) => {
        function ramme(n) {
          if (stoppet) { ferdig(); return; }
          const t = (n - t0) / 1000;
          spor.forEach((s, i) => {
            const u = t / tider[i];
            const p = u < 1 ? hentP(profiler[i], u) : 1 + Math.min(0.08, (t - tider[i]) * 0.06);
            s.ekvipasje.style.transform = `translateX(${(p * malX).toFixed(1)}px)`;
          });
          if (!malfoto && t >= tider[valgt]) {
            malfoto = true;
            blits.classList.add('blink');
            Lyd.stoy(0.12, 0.2, 5000);
          }
          if (t < Math.max(...tider) + 0.5) requestAnimationFrame(ramme); else ferdig();
        }
        requestAnimationFrame(ramme);
      });
      if (stoppet) return;
      lop.classList.remove('i-gang');
      const vinner = spor[valgt];
      vinner.knapp.classList.add('vinner');
      vinner.rytter.classList.add('jubel');
      vinner.knapp.append(el('span', { class: 'malfoto', text: 'Målfoto' }));
      ctx.tekst(`${vinner.navn} vant med et nesehår!`);
      Lyd.pop();
      vibrer([20, 30, 20]);
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1500);
    }
    return { stopp() { stoppet = true; } };
  },
};

/* Memory: finn seks par. Fire av parene er de to personene med ulik hodepynt. */
SPILL.memory = {
  tittel: 'Memory',
  tekst: 'Snu to og to kort, og finn alle parene.',
  start(ctx) {
    const dag = ctx.dag;
    const hatter = Object.keys(HATTER);
    const h = (k) => hatter[(dag * 3 + k * 2) % hatter.length];
    const motiver = [
      { id: 'a', lag: () => figurHode({ hvem: 'han', variant: 2, hatt: h(0), nese: h(0) === 'gevir', tett: true }) },
      { id: 'b', lag: () => figurHode({ hvem: 'hun', variant: 2, hatt: h(1), nese: h(1) === 'gevir', tett: true }) },
      { id: 'c', lag: () => figurHode({ hvem: 'han', variant: 1, hatt: h(2), nese: h(2) === 'gevir', tett: true }) },
      { id: 'd', lag: () => figurHode({ hvem: 'hun', variant: 1, hatt: h(3), nese: h(3) === 'gevir', tett: true }) },
      { id: 'e', lag: () => el('span', { class: 'symbol', text: '🎄' }) },
      { id: 'f', lag: () => el('span', { class: 'symbol', text: '⭐' }) },
    ];
    const kortstokk = stokk([...motiver, ...motiver]);
    let forsok = 0;
    let apne = [];
    let funnet = 0;
    let laast = false;
    let stoppet = false;
    const kort = kortstokk.map((m, i) => {
      const k = el('button', { class: 'kort', 'aria-label': `Kort ${i + 1}` },
        el('span', { class: 'kort__inner' }, el('span', { class: 'kort__bak' }), el('span', { class: 'kort__forside' }, m.lag())));
      k.addEventListener('click', () => snu(i));
      return { m, el: k, funnet: false };
    });
    ctx.scene.append(el('div', { class: 'memory' }, ...kort.map((k) => k.el)));

    function snu(i) {
      const k = kort[i];
      if (laast || stoppet || k.funnet || apne.includes(i)) return;
      Lyd.start();
      Lyd.tone(660, 0.05, 'triangle', 0.05);
      k.el.classList.add('snudd');
      apne.push(i);
      if (apne.length < 2) return;
      forsok++;
      const [a, b] = apne.map((j) => kort[j]);
      if (a.m.id === b.m.id) {
        a.funnet = b.funnet = true;
        setTimeout(() => { a.el.classList.add('funnet'); b.el.classList.add('funnet'); Lyd.pop(); vibrer(12); }, 250);
        apne = [];
        funnet++;
        ctx.tekst(`Par! ${funnet} av 6 funnet.`);
        if (funnet === 6) ferdig();
      } else {
        laast = true;
        ctx.tekst(`Ikke likt. Forsøk nr. ${forsok}.`);
        setTimeout(() => {
          a.el.classList.remove('snudd');
          b.el.classList.remove('snudd');
          apne = [];
          laast = false;
        }, REDUSERT ? 300 : 850);
      }
    }

    function ferdig() {
      stoppet = true;
      ctx.tekst(`Alle parene på ${forsok} forsøk!`);
      kort.forEach((k, i) => setTimeout(() => k.el.classList.add('bolge'), i * 60));
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1500);
    }
    return { stopp() { stoppet = true; } };
  },
};

/* Pakkeåpning på julaften: riv av gavepapiret. Når pakken åpnes,
   spretter begge opp i julestas – han som julenisse, hun som engel – med «God jul!». */
SPILL.pakkeapning = {
  tittel: 'Pakkeåpning',
  tekst: 'Riv av gavepapiret med fingeren.',
  start(ctx) {
    const RAD = 4;
    const biter = [];
    const papir = el('div', { class: 'papir' });
    for (let r = 0; r < RAD; r++) {
      for (let c = 0; c < RAD; c++) {
        const b = el('span', { class: 'bit' });
        papir.append(b);
        biter.push({ el: b, r, c, revet: false });
      }
    }
    const sloyfe = el('div', { class: 'storsloyfe', html: `<svg viewBox="-60 -50 120 70" aria-hidden="true">${HATTER.sloyfe.svg}</svg>` });
    const indre = el('div', { class: 'indre' }, el('div', { class: 'indre__kropp' }), el('div', { class: 'indre__lokk' }));
    const utspring = el('div', { class: 'utspring' });
    const gave = el('div', { class: 'storgave' }, indre, utspring, papir,
      el('div', { class: 'band band--v' }), el('div', { class: 'band band--h' }), sloyfe);
    ctx.scene.append(gave);

    let revet = 0;
    let ferdig = false;
    let stoppet = false;

    function riv(b, stille = false) {
      if (b.revet) return;
      b.revet = true;
      revet++;
      const dx = (b.c - 1.5) * tilfeldig(60, 120);
      const dy = (b.r - 1.5) * tilfeldig(40, 100) - tilfeldig(40, 120);
      b.el.style.setProperty('--dx', `${dx}px`);
      b.el.style.setProperty('--dy', `${dy}px`);
      b.el.style.setProperty('--rot', `${tilfeldig(-80, 80)}deg`);
      b.el.classList.add('revet');
      if (!stille) { Lyd.riv(); vibrer(8); }
      if (revet === 5) { gave.classList.add('band-borte'); Lyd.pop(); }
      if (revet >= 11 && !ferdig) aapne();
    }

    const bitVed = (e) => {
      const r = papir.getBoundingClientRect();
      const c = Math.floor(((e.clientX - r.left) / r.width) * RAD);
      const rr = Math.floor(((e.clientY - r.top) / r.height) * RAD);
      if (c < 0 || rr < 0 || c >= RAD || rr >= RAD) return null;
      return biter[rr * RAD + c];
    };
    let drar = false;
    gave.addEventListener('pointerdown', (e) => {
      if (ferdig) return;
      drar = true;
      gave.setPointerCapture(e.pointerId);
      Lyd.start();
      const b = bitVed(e);
      if (b) riv(b);
    });
    gave.addEventListener('pointermove', (e) => {
      if (!drar || ferdig) return;
      const b = bitVed(e);
      if (b) riv(b);
    });
    const slipp = () => { drar = false; };
    gave.addEventListener('pointerup', slipp);
    gave.addEventListener('pointercancel', slipp);

    const knapp = ctx.knapp('Riv alt', async () => {
      knapp.disabled = true;
      for (const b of stokk(biter)) {
        if (ferdig || stoppet) break;
        riv(b);
        await vent(REDUSERT ? 0 : 90);
      }
    }, true);

    async function aapne() {
      ferdig = true;
      knapp.disabled = true;
      gave.classList.add('band-borte');
      for (const b of biter) { if (!b.revet) { riv(b, true); await vent(REDUSERT ? 0 : 50); } }
      ctx.tekst('Hva er det i pakken?');
      await vent(REDUSERT ? 50 : 650);
      if (stoppet) return;
      gave.classList.add('apnet');
      Lyd.pop();
      const han = figurDrakt({ hvem: 'han', variant: 2, drakt: 'nisse', klasse: 'spretter spretter--v' });
      const hun = figurDrakt({ hvem: 'hun', variant: 2, drakt: 'engel', klasse: 'spretter spretter--h' });
      const banner = el('div', { class: 'julebanner', text: 'God jul!' });
      utspring.append(han, hun);
      gave.append(banner);
      Lyd.boing();
      vibrer([20, 40, 20]);
      await vent(REDUSERT ? 50 : 700);
      han.classList.add('jubel');
      hun.classList.add('jubel');
      ctx.tekst('God jul!');
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1900);
    }
    return { stopp() { stoppet = true; ferdig = true; } };
  },
};

/* ==========================================================================
   Appen: kalender, spillskjerm, gevinstbillett og beskjeder.
   ========================================================================== */

// Lukenes plassering i et 5 × 5-rutenett (24 er dobbelt så bred), som på en ekte julekalender
const REKKEFOLGE = [13, 4, 22, 9, 17, 1, 11, 6, 19, 2, 15, 8, 21, 14, 3, 20, 10, 5, 18, 23, 7, 24, 16, 12];
const DORFARGER = ['rod', 'gran', 'natt'];

const IKON = {
  tilbake: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lydPa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  lydAv: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};

function hentNokkel() {
  if (DEMO) return 'demo';
  const k = new URLSearchParams(location.search).get('k');
  if (k) { Lager.sett('julekalender.k', k); return k; }
  return Lager.hent('julekalender.k', null);
}

const App = {
  nokkel: null,
  status: null,
  rot: null,
  spill: null,
  avslorer: false,
  harHistorikk: false,
  beskjedTimer: null,

  async start() {
    this.rot = document.getElementById('app');
    document.title = CONFIG.familie ? `${CONFIG.familie} Julekalender` : 'Julekalender';
    window.addEventListener('popstate', () => {
      this.harHistorikk = false;
      if (this.spill && !this.avslorer) this.lukkSpill();
    });
    this.nokkel = hentNokkel();
    if (!this.nokkel) {
      this.visFeil(new ApiFeil('Kalenderen trenger din personlige lenke. Åpne lenken du fikk tilsendt.', 'MANGLER'));
      return;
    }
    this.visLaster();
    try {
      this.status = await Api.status(this.nokkel);
    } catch (e) {
      this.visFeil(e);
      return;
    }
    this.visKalender(true);
    const apne = parseInt(new URLSearchParams(location.search).get('apne'), 10);
    if (apne >= 1 && apne <= ANTALL && (DEMO || this.status.isTest)) this.trykkLuke(apne);
  },

  /** Hvilken dag figurenes kostymer skal hentes fra. */
  visningsdag() {
    const s = this.status;
    if (s && !s.isTest && s.openDay) return s.openDay;
    const d = new Date();
    return d.getMonth() === 11 ? Math.min(ANTALL, d.getDate()) : ((d.getDate() - 1) % ANTALL) + 1;
  },

  visLaster() {
    this.rot.replaceChildren(el('div', { class: 'senter', role: 'status' },
      el('div', { class: 'lasteprikker', 'aria-hidden': 'true' }, el('i'), el('i'), el('i')),
      el('p', { text: 'Henter kalenderen …' })));
  },

  visFeil(e) {
    const tittel = { MANGLER: 'Mangler personlig lenke', UKJENT: 'Fant ikke lenken din', NETT: 'Ingen kontakt' }[e.kode] || 'Noe gikk galt';
    let figur = null;
    try { figur = figurFoto({ bilde: 'hun-armer', hatter: ['nisselue'] }); } catch (err) { figur = null; }
    const knapper = (e.kode === 'NETT' || e.kode === 'FEIL') ? el('button', { class: 'knapp', text: 'Prøv igjen', onclick: () => this.start() }) : null;
    this.rot.replaceChildren(el('div', { class: 'senter' }, figur, el('h1', { text: tittel }), el('p', { text: e.message }), knapper));
  },

  /* ---------- Kalenderen ------------------------------------------------ */

  meldingstekst() {
    const s = this.status;
    if (s.closed) return 'Kalenderen er stengt for i år. Takk for i år!';
    if (s.beforeStart) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s.now || '');
      if (m) {
        const dager = Math.round((Date.UTC(s.year, 11, 1) - Date.UTC(+m[1], +m[2] - 1, +m[3])) / 86400000);
        if (dager > 1) return `Første luke åpner 1. desember, om ${dager} dager.`;
        if (dager === 1) return 'Første luke åpner i morgen!';
      }
      return 'Første luke åpner 1. desember.';
    }
    if (s.isTest) return s.demo ? 'Alle lukene er åpne i demoen.' : 'Alle lukene er åpne for testing.';
    const tilGode = s.days.filter((d) => d.day < s.openDay && !d.opened).length;
    const idag = s.days[s.openDay - 1];
    if (idag && !idag.opened) {
      return tilGode ? `Dagens luke venter, og du har ${tilGode} ${tilGode === 1 ? 'luke' : 'luker'} til gode.` : 'Dagens luke venter på deg.';
    }
    if (tilGode) return `Du har ${tilGode} ${tilGode === 1 ? 'luke' : 'luker'} til gode.`;
    if (s.openDay >= ANTALL) return 'Alle lukene er åpnet. God jul!';
    return 'Dagens luke er åpnet. Ny luke i morgen!';
  },

  visKalender(forste = false) {
    const s = this.status;
    const dag = this.visningsdag();
    const hattHan = dagensHatt(dag, 'han');
    const hattHun = dagensHatt(dag, 'hun');
    const side = el('div', { class: `kalender${forste ? ' titt-inn' : ''}` });

    const bytt = (hash) => { try { location.hash = hash; location.reload(); } catch (e) { /* ignoreres */ } };
    if (s.demo && s.isTest) {
      side.append(el('div', { class: 'banner' },
        el('span', { text: 'Demo: alle lukene er åpne, og trekningene lagres bare på denne enheten.' }),
        el('span', { class: 'banner__knapper' },
          el('button', { class: 'knapp knapp--liten', text: 'Se som deltaker', onclick: () => bytt('dag-9') }),
          el('button', { class: 'knapp knapp--liten', text: 'Nullstill alle', onclick: () => this.nullstill() }))));
    } else if (s.demo) {
      side.append(el('div', { class: 'banner' },
        el('span', { text: `Demo: slik ser det ut for en deltaker ${s.openDay}. desember.` }),
        el('button', { class: 'knapp knapp--liten', text: 'Tilbake', onclick: () => bytt('') })));
    } else if (s.isTest) {
      side.append(el('div', { class: 'banner' },
        el('span', { text: 'Testbruker: alle luker er åpne, og ingenting blir utbetalt.' }),
        el('button', { class: 'knapp knapp--liten', text: 'Nullstill alle', onclick: () => this.nullstill() })));
    }

    const hoder = el('div', { class: 'skilt__hoder' },
      figurHode({ hvem: 'han', variant: 2, hatt: hattHan, nese: hattHan === 'gevir', fast: true }),
      figurHode({ hvem: 'hun', variant: 2, hatt: hattHun, nese: hattHun === 'gevir', fast: true }));
    const tittel = el('h1', {}, CONFIG.familie ? el('span', { class: 'skilt__familie', text: CONFIG.familie }) : null, el('span', { class: 'skilt__navn', text: 'Julekalender' }));
    side.append(el('header', { class: 'skilt' }, hoder, el('div', { class: 'skilt__tavle' }, tittel)));

    const hilsen = el('p', { class: 'hilsen' }, 'Hei, ', el('strong', { text: s.name }), '!');
    if (s.total) hilsen.append(' Du har vunnet ', el('span', { class: 'sum', text: `${s.total} kr` }), ' så langt.');
    side.append(hilsen, el('p', { class: 'melding', text: this.meldingstekst() }));

    const rutenett = el('div', { class: 'luker' });
    let kol = 0;
    let rad = 0;
    REKKEFOLGE.forEach((n) => {
      rutenett.append(this.lagLuke(n, DORFARGER[(kol + rad) % 3]));
      kol += n === 24 ? 2 : 1;
      if (kol >= 5) { kol = 0; rad++; }
    });
    side.append(rutenett);
    side.append(el('p', { class: 'fot', text: s.beforeStart ? 'Lagre siden på hjemskjermen, så finner du den lett igjen.' : 'Trykk på en luke for å åpne den.' }));
    this.rot.replaceChildren(side);
    requestAnimationFrame(() => this.tegnLys());
  },

  lagLuke(n, farge) {
    const s = this.status;
    const d = s.days[n - 1];
    const klasser = ['luke'];
    if (n === 24) klasser.push('luke--24');
    let innhold;
    let etikett;
    if (d.opened) {
      klasser.push('luke--apnet');
      innhold = [el('span', { class: 'luke__nr', text: n }), el('span', { class: 'stubb' }, el('b', { text: d.amount }), el('small', { text: 'kr' }))];
      etikett = `Luke ${n}, åpnet, ${d.amount} kroner`;
    } else if (s.closed || n > s.openDay) {
      klasser.push('luke--last');
      innhold = [String(n)];
      etikett = s.closed ? `Luke ${n}, stengt` : `Luke ${n}, åpner ${n}. desember`;
    } else if (n === s.openDay || s.isTest) {
      if (n === s.openDay && !s.isTest) klasser.push('luke--idag');
      innhold = [String(n)];
      etikett = `Luke ${n}, klar til å åpnes`;
    } else {
      klasser.push('luke--tilgode');
      innhold = [String(n), el('span', { class: 'merke', text: 'til gode' })];
      etikett = `Luke ${n}, til gode`;
    }
    return el('button', { class: klasser.join(' '), 'data-farge': farge, 'data-luke': n, 'aria-label': etikett, onclick: () => this.trykkLuke(n) }, ...innhold);
  },

  /** Lyspærer som jager rundt dagens luke (tegnes etter at størrelsen er kjent). */
  tegnLys() {
    const dor = this.rot.querySelector('.luke--idag');
    if (!dor) return;
    const b = dor.offsetWidth + 10;
    const h = dor.offsetHeight + 10;
    const rx = 13;
    const omkrets = 2 * (b - 2 * rx) + 2 * (h - 2 * rx) + 2 * Math.PI * rx - 24;
    const n = Math.max(12, Math.round(omkrets / 13));
    const g = omkrets / n;
    const svg = document.createElementNS(svgNs, 'svg');
    svg.setAttribute('class', 'lys');
    svg.setAttribute('viewBox', `0 0 ${b} ${h}`);
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = `<rect class="av" x="5" y="5" width="${b - 10}" height="${h - 10}" rx="${rx}" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="0 ${g.toFixed(3)}" pathLength="${omkrets.toFixed(3)}"/>` +
      `<rect class="pa" x="5" y="5" width="${b - 10}" height="${h - 10}" rx="${rx}" fill="none" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="0 ${(g * 3).toFixed(3)}" pathLength="${omkrets.toFixed(3)}"/>`;
    dor.append(svg);
    const pa = svg.querySelector('.pa');
    if (!REDUSERT && pa.animate) {
      pa.style.animation = 'none';
      pa.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -g * 3 }], { duration: 900, iterations: Infinity, easing: 'steps(3)' });
    }
  },

  trykkLuke(n) {
    Lyd.start();
    const s = this.status;
    const d = s.days[n - 1];
    if (d.opened) { this.visApnet(n); return; }
    if (s.closed) { this.visBeskjed('Kalenderen er stengt for i år.'); return; }
    if (n > s.openDay) {
      const dor = this.rot.querySelector(`[data-luke="${n}"]`);
      if (dor && dor.animate) dor.animate([{ translate: '0 0' }, { translate: '-5px 0' }, { translate: '5px 0' }, { translate: '-3px 0' }, { translate: '0 0' }], { duration: 320 });
      vibrer(20);
      this.visBeskjed(s.beforeStart ? 'Ikke ennå! Kalenderen åpner 1. desember.' : `Ikke ennå! Luke ${n} åpner ${n}. desember.`);
      return;
    }
    this.startSpill(n);
  },

  async nullstill(dag) {
    try {
      this.status = await Api.nullstill(this.nokkel, dag);
      this.visKalender();
    } catch (e) {
      this.visBeskjed(e.message);
    }
  },

  /** Hun med armene i kors dukker opp nederst med en snakkeboble. */
  visBeskjed(tekst) {
    document.querySelectorAll('.beskjed').forEach((b) => b.remove());
    clearTimeout(this.beskjedTimer);
    const dag = this.visningsdag();
    const hatt = dagensHatt(dag, 'hun');
    const boks = el('div', { class: 'beskjed', role: 'status' },
      el('div', { class: 'beskjed__innhold' }, figurFoto({ bilde: 'hun-armer', hatter: [hatt], neser: [hatt === 'gevir'] }), snakkeboble(tekst)));
    const lukk = () => {
      boks.classList.add('borte');
      setTimeout(() => boks.remove(), 380);
    };
    boks.addEventListener('click', lukk);
    document.body.append(boks);
    this.beskjedTimer = setTimeout(lukk, 2800);
  },

  /** En åpnet luke: vis billetten på nytt. */
  visApnet(n) {
    const s = this.status;
    const d = s.days[n - 1];
    const lukk = () => overlay.remove();
    const knapper = [el('button', { class: 'knapp', text: 'Lukk', onclick: lukk })];
    if (s.isTest) {
      knapper.unshift(el('button', {
        class: 'knapp knapp--sekundar',
        text: 'Spill igjen',
        onclick: async () => {
          lukk();
          try { this.status = await Api.nullstill(this.nokkel, n); } catch (e) { this.visBeskjed(e.message); return; }
          this.startSpill(n);
        },
      }));
    }
    const billett = el('div', { class: 'billett', style: { transform: 'none' } },
      el('p', { class: 'billett__luke', text: `Luke ${n}: ${LUKENAVN[d.type] || ''}` }),
      el('p', { class: 'billett__tittel', text: n === 24 ? 'God jul!' : 'Gevinst!' }),
      el('p', { class: 'billett__belop' }, String(d.amount), el('small', { text: ' kr' })),
      el('p', { class: 'billett__info', text: s.isTest ? 'Testgevinst, ingenting blir utbetalt.' : 'Denne luken er åpnet.' }));
    const overlay = el('div', { class: 'avsloring', role: 'dialog', 'aria-modal': 'true', 'aria-label': `Luke ${n}`, onclick: (e) => { if (e.target === overlay) lukk(); } },
      el('div', {}, el('div', { class: 'automat' }, el('div', { class: 'automat__spalte' }), el('div', { class: 'automat__vindu' }, billett)), el('div', { class: 'handling' }, ...knapper)));
    document.body.append(overlay);
    knapper[knapper.length - 1].focus();
  },

  /* ---------- Spillskjermen --------------------------------------------- */

  startSpill(n) {
    const s = this.status;
    const d = s.days[n - 1];
    const type = d.type || 'hjul';
    const spill = SPILL[type] || SPILL.hjul;
    const scene = el('div', { class: `scene scene--${type}` });
    const handling = el('div', { class: 'handling' });
    const tekst = el('p', { class: 'spill-tekst', 'aria-live': 'polite', text: spill.tekst });
    const lydknapp = el('button', { class: 'ikonknapp', 'aria-label': Lyd.pa ? 'Slå av lyd' : 'Slå på lyd', html: Lyd.pa ? IKON.lydPa : IKON.lydAv });
    lydknapp.addEventListener('click', () => {
      Lyd.sett(!Lyd.pa);
      lydknapp.innerHTML = Lyd.pa ? IKON.lydPa : IKON.lydAv;
      lydknapp.setAttribute('aria-label', Lyd.pa ? 'Slå av lyd' : 'Slå på lyd');
    });
    const tilbake = el('button', { class: 'tilbake', html: `${IKON.tilbake}<span>Kalender</span>`, onclick: () => this.tilbakeFraSpill() });
    const skjerm = el('div', { class: 'spillskjerm' },
      el('div', { class: 'topplinje' }, tilbake, el('span', { class: 'lukeetikett', text: `Luke ${n}` }), lydknapp),
      el('h1', { class: 'spill-tittel', text: n === 24 ? `God jul, ${s.name}!` : spill.tittel }),
      tekst, scene, handling);
    this.rot.replaceChildren(skjerm);
    window.scrollTo(0, 0);
    if (!this.harHistorikk) {
      try { history.pushState({ luke: n }, ''); this.harHistorikk = true; } catch (e) { this.harHistorikk = false; }
    }

    const ctx = {
      dag: n,
      navn: s.name,
      scene,
      handling,
      tekst: (t) => { tekst.textContent = t; },
      knapp: (t, fn, sekundar = false) => {
        const b = el('button', { class: `knapp${sekundar ? ' knapp--sekundar' : ''}`, text: t, onclick: fn });
        handling.append(b);
        return b;
      },
      vunnet: () => this.avslor(n),
      aktiv: () => this.spill && this.spill.n === n,
    };
    this.spill = { n, type, kontroll: {} };
    try {
      this.spill.kontroll = spill.start(ctx) || {};
    } catch (e) {
      console.error(e);
      ctx.tekst('Noe gikk galt med spillet. Trykk på knappen for å åpne luken likevel.');
      ctx.knapp('Åpne luken', () => ctx.vunnet());
    }
  },

  tilbakeFraSpill() {
    if (this.harHistorikk) { history.back(); return; } // popstate lukker spillet
    this.lukkSpill();
  },

  lukkSpill() {
    if (this.spill && this.spill.kontroll && this.spill.kontroll.stopp) {
      try { this.spill.kontroll.stopp(); } catch (e) { /* ignoreres */ }
    }
    this.spill = null;
    this.visKalender();
  },

  /* ---------- Gevinstbilletten ------------------------------------------ */

  async avslor(n) {
    if (this.avslorer) return;
    this.avslorer = true;
    const s = this.status;
    const belop = el('p', { class: 'billett__belop' });
    const venter = el('p', { class: 'billett__venter', text: 'Skriver ut gevinsten …' });
    const billett = el('div', { class: 'billett skriver' },
      el('p', { class: 'billett__luke', text: `Luke ${n}` }),
      el('p', { class: 'billett__tittel', text: n === 24 ? 'God jul!' : 'Gevinst!' }), belop, venter);
    const handling = el('div', { class: 'handling' });
    const automat = el('div', { class: 'automat' }, el('div', { class: 'automat__spalte' }), el('div', { class: 'automat__vindu' }, billett));
    const ramme = el('div', { class: 'med-cameo' }, automat, handling);
    const overlay = el('div', { class: 'avsloring', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Gevinst' }, ramme);
    document.body.append(overlay);
    animer(REDUSERT ? 10 : 650, (e) => { billett.style.transform = `translateY(${-100 + 42 * e}%)`; }, ease.utKubisk);

    let res = null;
    while (!res) {
      try {
        res = await Api.aapne(this.nokkel, n);
      } catch (e) {
        billett.classList.remove('skriver');
        venter.className = 'billett__feil';
        venter.textContent = e.message;
        const valg = await new Promise((r) => {
          handling.replaceChildren(
            el('button', { class: 'knapp', text: 'Prøv igjen', onclick: () => r('igjen') }),
            el('button', { class: 'knapp knapp--sekundar', text: 'Til kalenderen', onclick: () => r('ut') }));
        });
        handling.replaceChildren();
        if (valg === 'ut') {
          overlay.remove();
          this.avslorer = false;
          this.tilbakeFraSpill();
          return;
        }
        venter.className = 'billett__venter';
        venter.textContent = 'Skriver ut gevinsten …';
        billett.classList.add('skriver');
      }
    }
    if (res.status) this.status = res.status;
    billett.classList.remove('skriver');
    venter.remove();
    await animer(REDUSERT ? 10 : 520, (e) => { billett.style.transform = `translateY(${-58 + 58 * e}%)`; }, ease.utTilbake);
    billett.style.transform = 'none';

    const tall = el('span', { text: '0' });
    belop.replaceChildren(tall, el('small', { text: ' kr' }));
    belop.classList.add('stempel');
    Lyd.vinn();
    vibrer([30, 50, 30]);
    konfetti();
    await animer(REDUSERT ? 10 : 950, (e) => {
      const v = Math.round((e * res.amount) / 5) * 5;
      if (tall.textContent !== String(v)) { tall.textContent = String(v); Lyd.telle(); }
    }, ease.utKubisk);
    tall.textContent = String(res.amount);
    const info = s.isTest
      ? (s.demo ? 'Dette er en demo. Ingenting blir utbetalt.' : 'Testgevinst, ingenting blir utbetalt.')
      : 'Gevinsten er registrert og blir utbetalt.';
    billett.append(el('p', { class: 'billett__info', text: info }));
    this.visCameo(automat, n);

    const ferdig = el('button', {
      class: 'knapp',
      text: 'Tilbake til kalenderen',
      onclick: () => {
        overlay.remove();
        this.avslorer = false;
        this.tilbakeFraSpill();
      },
    });
    handling.replaceChildren(ferdig);
    ferdig.focus();
  },

  /** En av dem dukker opp bak billettautomaten – i ulike former fra dag til dag. */
  visCameo(automat, n) {
    let figur;
    let tekst;
    const fraser = ['Gratulerer!', 'Bra jobba!', 'Heia deg!', 'Jippi!', 'Kjempebra!', 'Så flott!'];
    if (n === ANTALL) {
      figur = figurFoto({ bilde: 'par', hatter: ['nisselue', 'nisselue'] });
      tekst = 'God jul!';
    } else if (n % 2) {
      const h = dagensHatt(n, 'han');
      figur = figurFoto({ bilde: 'han-tommel', hatter: [h], neser: [h === 'gevir'] });
      tekst = fraser[n % fraser.length];
    } else {
      figur = figurDrakt({ hvem: 'hun', variant: dagensVariant(n, 'hun'), drakt: dagensKostyme(n, 'hun'), klasse: 'jubel' });
      tekst = fraser[(n + 3) % fraser.length];
    }
    figur.classList.add('cameo');
    automat.append(el('div', { class: 'cameo-ramme' }, figur), snakkeboble(tekst, 'cameo-boble'));
  },
};

document.addEventListener('DOMContentLoaded', () => App.start());

</script>
</body>
</html>
