/* ==========================================================================
   Julekalenderen – juletivoli om natten
   Farger: natteblå bunn, lyspæregull, strikkerødt, granbar, ullhvit billettpapir.
   ========================================================================== */

:root {
  --natt: #1b1f4b;
  --natt-2: #262c66;
  --natt-3: #12153a;
  --natt-lys: #343b8a;
  --paere: #ffc93c;
  --paere-mork: #b88a12;
  --rod: #c8202a;
  --rod-mork: #8f141c;
  --gran: #1e6b45;
  --gran-mork: #124530;
  --ull: #f6eedf;
  --sno: #f5f7ff;
  --sno-dim: #b9bfe6;
  --display: 'Alfa Slab One', 'Rockwell', 'Roboto Slab', 'Georgia', serif;
  --tekst: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --topp: env(safe-area-inset-top, 0px);
  --bunn: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--natt);
  color: var(--sno);
  font: 16px/1.45 var(--tekst);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
/* stille snø i bakgrunnen (ingen bevegelse) */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1.6px 1.6px at 14% 12%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 72% 8%, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.8px 1.8px at 38% 31%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 88% 37%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 6% 58%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 54% 66%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1.7px 1.7px at 92% 82%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.2px 1.2px at 26% 88%, rgba(255,255,255,.45), transparent 60%);
  background-size: 260px 300px;
  opacity: .7;
}

button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--paere); outline-offset: 3px; border-radius: 10px; }

.app {
  position: relative;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(10px + var(--topp)) 14px calc(24px + var(--bunn));
}

.skjult { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Knapper ------------------------------------------------------ */
.knapp {
  appearance: none;
  border: 0;
  border-radius: 999px;
  min-height: 52px;
  padding: 14px 26px;
  font: 700 17px/1.1 var(--tekst);
  background: var(--paere);
  color: var(--natt-3);
  box-shadow: 0 4px 0 var(--paere-mork);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s, box-shadow .08s, opacity .2s;
}
.knapp:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--paere-mork); }
.knapp:disabled { opacity: .4; cursor: default; transform: none; box-shadow: 0 4px 0 var(--paere-mork); }
.knapp--sekundar { background: transparent; color: var(--sno); box-shadow: inset 0 0 0 2px rgba(245,247,255,.55); }
.knapp--sekundar:active { box-shadow: inset 0 0 0 2px rgba(245,247,255,.55); }
.knapp--liten { min-height: 40px; padding: 9px 16px; font-size: 15px; }

.ikonknapp {
  appearance: none;
  border: 0;
  background: transparent;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--sno);
}
.ikonknapp svg { width: 24px; height: 24px; }

/* ---------- Bannere (test og demo) --------------------------------------- */
.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 2px 0 6px;
  padding: 10px 12px;
  border-radius: 12px;
  background: repeating-linear-gradient(-45deg, #ffc93c 0 14px, #f3b928 14px 28px);
  color: var(--natt-3);
  font-size: 14px;
  font-weight: 650;
  line-height: 1.3;
}
.banner .knapp { background: var(--natt-3); color: var(--sno); box-shadow: none; flex: none; }
.banner__knapper { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 52%; }

/* ---------- Skiltet med de to som titter fram ---------------------------- */
.skilt { position: relative; margin: 112px auto 0; max-width: 380px; }
.skilt__hoder {
  position: absolute;
  z-index: 1;
  left: 0;
  right: 0;
  top: -136px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 26px;
  pointer-events: none;
}
.skilt__hoder .figur { height: 150px; width: auto; }
.skilt__hoder .figur:first-child { transform: rotate(-6deg); }
.skilt__hoder .figur:last-child { transform: rotate(6deg); }
.titt-inn .skilt__hoder .figur { animation: tittOpp .9s cubic-bezier(.2,1.4,.4,1) both; }
.titt-inn .skilt__hoder .figur:last-child { animation-delay: .18s; }
@keyframes tittOpp { from { translate: 0 70px; } to { translate: 0 0; } }

.skilt__tavle {
  position: relative;
  z-index: 2;
  padding: 16px 16px 15px;
  border-radius: 18px;
  background: var(--rod);
  box-shadow: inset 0 0 0 3px rgba(255, 201, 60, .6), inset 0 0 0 7px var(--rod), inset 0 0 0 8px rgba(255, 201, 60, .25), 0 6px 0 var(--natt-3);
  text-align: center;
}
.skilt__tavle h1 {
  margin: 0;
  font: 400 clamp(30px, 9.2vw, 44px)/1 var(--display);
  letter-spacing: .01em;
  color: var(--sno);
  text-shadow: 0 3px 0 var(--rod-mork);
}

.hilsen { margin: 16px 2px 0; font-size: 17px; }
.hilsen strong { font-weight: 700; }
.hilsen .sum { font: 400 19px/1 var(--display); color: var(--paere); white-space: nowrap; }
.melding { margin: 4px 2px 0; color: var(--sno-dim); font-size: 15px; }

/* ---------- Lukene ------------------------------------------------------- */
.luker {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 16px;
}
.luke {
  --dor: var(--rod);
  position: relative;
  aspect-ratio: 4 / 5;
  border: 0;
  border-radius: 10px;
  padding: 0;
  background: var(--dor);
  color: var(--sno);
  font: 400 clamp(19px, 6vw, 27px)/1 var(--display);
  cursor: pointer;
  touch-action: manipulation;
  box-shadow: inset 0 0 0 2px rgba(255, 201, 60, .34), inset 0 -6px 0 rgba(0, 0, 0, .2), 0 4px 0 var(--natt-3);

}
.luke::after { /* dørhåndtak */
  content: '';
  position: absolute;
  right: 9%;
  top: 50%;
  width: 6px;
  height: 6px;
  border-radius: 50%;

.luke:active { transform: translateY(2px); }
.luke--24 { grid-column: span 2; aspect-ratio: auto; font-size: clamp(26px, 8vw, 36px); }
.luke[data-farge='gran'] { --dor: var(--gran); }

.luke--last { filter: saturate(.5) brightness(.72); }
.luke--last::after { opacity: .4; }

.luke--idag { z-index: 2; transform: translateY(-2px); box-shadow: inset 0 0 0 2px rgba(255, 201, 60, .7), inset 0 -6px 0 rgba(0, 0, 0, .2), 0 0 22px rgba(255, 201, 60, .45), 0 6px 0 var(--natt-3); }
.luke .lys { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; overflow: visible; }
.lys .av { stroke: #8a6a1c; }
.lys .pa { stroke: var(--paere); filter: drop-shadow(0 0 3px rgba(255, 201, 60, .95)); animation: jage .9s steps(3) infinite; }
@keyframes jage { to { stroke-dashoffset: var(--periode); } }

.merke {
  position: absolute;
  left: 50%;
  bottom: 6%;

  color: var(--natt-3);
  font: 700 10px/1 var(--tekst);
  white-space: nowrap;
}

.luke--apnet { background: var(--natt-3); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08), 0 4px 0 #0b0d26; }
.luke--apnet::after { display: none; }
.luke__nr { position: absolute; left: 7px; top: 6px; font: 400 12px/1 var(--display); color: var(--sno-dim); }
.stubb {
  position: absolute;
  inset: 26% 10% 12%;
  display: grid;
  place-items: center;
  align-content: center;
  border-radius: 6px;
  background: var(--ull);
  color: var(--natt-3);
  -webkit-mask: radial-gradient(circle 5px at 0 50%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 5px at 0 50%, transparent 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 5px at 100% 50%, transparent 97%, #000) right / 51% 100% no-repeat;
}
.stubb b { font: 400 clamp(15px, 4.6vw, 22px)/1 var(--display); }
.stubb small { font: 700 10px/1.2 var(--tekst); opacity: .7; }

.fot { margin: 22px 2px 0; color: var(--sno-dim); font-size: 13px; text-align: center; }

/* ---------- «Ikke ennå» og andre små beskjeder --------------------------- */
.beskjed {
  position: fixed;
  inset: auto 0 0;
  z-index: 40;
  display: flex;
  justify-content: center;
  pointer-events: none;
}

.beskjed .snakkeboble { position: absolute; right: 12px; top: 6px; max-width: 200px; animation: boble .4s .25s cubic-bezier(.2,1.4,.4,1) both; }
.beskjed.borte .figur { animation: synk .35s ease-in both; }

@keyframes reisSeg { from { transform: translateY(110%); } to { transform: translateY(0); } }
@keyframes synk { to { transform: translateY(115%); } }
@keyframes boble { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.snakkeboble {

  padding: 12px 14px;
  border-radius: 16px;

  color: var(--natt-3);

/* ---------- Spillskjermen ------------------------------------------------ */
.spillskjerm { display: flex; flex-direction: column; min-height: calc(100dvh - 34px - var(--topp) - var(--bunn)); }
.topplinje { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px; }

}
.tilbake svg { width: 22px; height: 22px; }
.lukeetikett { font: 400 15px/1 var(--display); color: var(--paere); }
.spill-tittel { margin: 2px 0 0; font: 400 clamp(26px, 8vw, 34px)/1.05 var(--display); }

.figur { overflow: visible; display: block; }

.figur .arm-h { transform-origin: 138px 172px; }

.figur.jubel .kvist.arm-h { transform: rotate(-60deg); }

.figur.vink .arm-h { animation: vink .8s ease-in-out infinite; }
.figur.dupp { animation: dupp 1.2s ease-in-out infinite; }
.figur .glorie { animation: sveve 2.4s ease-in-out infinite; }
@keyframes hopp { 0%, 100% { translate: 0 0; } 50% { translate: 0 -12%; } }
@keyframes vink { 0%, 100% { transform: rotate(-125deg); } 50% { transform: rotate(-165deg); } }
@keyframes dupp { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3%; } }
@keyframes sveve { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ---------- Gevinstbilletten -------------------------------------------- */

.automat { position: relative; width: min(330px, 86vw); }

.med-cameo { padding-top: 200px; }
.cameo-ramme { position: absolute; z-index: 1; left: -20%; right: -20%; bottom: calc(100% - 12px); height: 250px; overflow: hidden; pointer-events: none; display: flex; justify-content: center; align-items: flex-end; }

.konfetti { position: fixed; inset: 0; z-index: 70; pointer-events: none; }

/* ---------- Laster og feil ---------------------------------------------- */
.senter { min-height: 80vh; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 20px; }

.lasteprikker i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .lys .pa { animation: none; }
}

/* ==========================================================================
   Spillene
   ========================================================================== */

/* ---------- Lykkehjul ---------------------------------------------------- */
.hjul { position: relative; width: min(340px, 94vw); padding-bottom: 86px; }

.hjul__nav { position: absolute; left: 38%; top: 38%; width: 24%; pointer-events: none; }

.vert { position: absolute; bottom: 0; width: 112px; height: auto; z-index: 3; }

/* ---------- Skrapelodd -------------------------------------------------- */
.lodd { position: relative; width: min(320px, 90vw, calc(100vh - 400px)); width: min(320px, 90vw, calc(100dvh - 400px)); padding-top: 88px; }

.lodd__titter .figur { position: absolute; z-index: 1; left: 50%; top: -42px; height: 152px; width: auto; translate: -50% 0; transition: transform .45s cubic-bezier(.2,1.5,.4,1); }

.vott { position: absolute; z-index: 3; bottom: -6px; width: 36px; height: 28px; border-radius: 16px 16px 10px 10px; background: var(--rod); border: 2.6px solid #231a1a; box-shadow: inset 0 -5px 0 var(--rod-mork); }
.vott::before { content: ''; position: absolute; top: -9px; width: 13px; height: 16px; border-radius: 8px; background: var(--rod); border: 2.6px solid #231a1a; border-bottom: 0; }
.vott--v { left: 4px; }
.vott--v::before { left: 2px; }
.vott--h { right: 4px; }
.vott--h::before { right: 2px; }
.lodd__titter.jubel .vott { animation: hoppe .45s ease-in-out 3; }
.lodd__boble { position: absolute; z-index: 4; left: 76%; top: -46px; white-space: nowrap; animation: boble .35s cubic-bezier(.2,1.4,.4,1) both; }
.lodd__kort { position: relative; z-index: 2; padding: 12px; border-radius: 18px; background: var(--ull); color: var(--natt-3); border: 3px solid #231a1a; box-shadow: 0 8px 0 rgba(0, 0, 0, .28); }

.lodd__navn { font: 400 24px/1 var(--display); color: var(--rod); }
.lodd__regel { font-size: 13px; font-weight: 700; }
.lodd__omraade { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid rgba(18, 21, 58, .25); }
.lodd__felt { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); background: #fff; }
.felt { display: grid; place-items: center; border: 1px dashed rgba(18, 21, 58, .14); overflow: hidden; }
.felt .symbol { font-size: clamp(30px, 10vw, 44px); line-height: 1; }

.felt.vinner { background: #fff1c2; box-shadow: inset 0 0 0 3px var(--paere); }

/* ---------- Enarmet banditt -------------------------------------------- */
.banditt { position: relative; display: flex; align-items: flex-end; padding-left: 64px; }

.blinker .banditt__skilt span { animation: blinke .25s steps(2) infinite; }
.banditt__vindu { --h: clamp(58px, 16.5vw, 68px); position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; height: calc(var(--h) * 3 + 6px); padding: 3px; border-radius: 12px; background: #231a1a; overflow: hidden; }
.valse { position: relative; overflow: hidden; border-radius: 7px; background: var(--ull); }

.banditt__panel { display: flex; justify-content: center; gap: 14px; margin: 12px 0 10px; }
.lampe { width: 16px; height: 16px; border-radius: 50%; background: #6b4e12; border: 2px solid #231a1a; }
.blinker .lampe { background: var(--paere); animation: blinke .3s steps(2) infinite; }
.blinker .lampe:nth-child(2) { animation-delay: .15s; }
.banditt__brett { position: relative; height: 34px; border-radius: 10px; background: var(--natt-3); border: 3px solid #231a1a; }
.mynt { position: absolute; top: -24px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 2px solid #231a1a; background: radial-gradient(circle at 35% 35%, #fff2b0, var(--paere) 55%, var(--paere-mork)); animation: myntfall .55s cubic-bezier(.5, 0, .8, .4) both; }

.banditt__spak { position: relative; width: 36px; height: 220px; margin-left: 2px; align-self: center; }

.spak__kule { position: absolute; left: 50%; top: -24px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8080, var(--rod) 60%, var(--rod-mork)); border: 3px solid #231a1a; cursor: grab; touch-action: none; transform: translateY(var(--dra, 0px)); transition: transform .25s; }

/* ---------- Velg en pakke ---------------------------------------------- */
.pakker { position: relative; width: min(340px, 94vw); height: 250px; }
.pakke { position: absolute; left: 50%; bottom: 24px; width: 30%; margin-left: -15%; padding: 0; border: 0; background: none; cursor: pointer; transition: opacity .4s, filter .4s; }

.klovn { position: absolute; left: 50%; bottom: 66%; width: 92%; margin-left: -46%; pointer-events: none; }
.klovn__hode { position: relative; transform-origin: 50% 100%; animation: klovnhode .7s cubic-bezier(.2,1.8,.4,1) both, vippe 1.4s .7s ease-in-out infinite; }
.klovn__hode .figur { width: 100%; height: auto; }
.klovn__fjaer { width: 26%; height: 64px; margin: -6px auto 0; transform-origin: 50% 100%; animation: fjaer .7s cubic-bezier(.2,1.8,.4,1) both; }

        b.r += b.vr;
        x.save();
        x.translate(b.x, b.y);
        x.rotate(b.r);
        x.fillStyle = b.f;
        x.globalAlpha = Math.max(0, 1 - t / 3200);
        x.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2)));
        x.restore();
      });
      if (t < 3200) requestAnimationFrame(ramme); else { c.remove(); res(); }
    }
    requestAnimationFrame(ramme);
  });
}

/* ---------- Kontakt med serveren ----------------------------------------- */
class ApiFeil extends Error {
  constructor(melding, kode) { super(melding); this.kode = kode || 'FEIL'; }
}

const FjernApi = {
  async kall(body) {
    const kontroll = new AbortController();
    const tidsavbrudd = setTimeout(() => kontroll.abort(), 25000);
    let data;
    try {
      // Vanlig tekst gir en «enkel» forespørsel uten CORS-forhåndssjekk (Apps Script støtter ikke den)
      const res = await fetch(CONFIG.apiUrl, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: kontroll.signal });
      data = await res.json();
    } catch (e) {
      throw new ApiFeil('Får ikke kontakt med kalenderen. Sjekk at du er på nett, og prøv igjen.', 'NETT');
    } finally {
      clearTimeout(tidsavbrudd);
    }
    if (!data || !data.ok) throw new ApiFeil((data && data.error) || 'Noe gikk galt. Prøv igjen om litt.', data && data.code);
    return data;
  },
  status(k) { return this.kall({ action: 'status', k }); },
  aapne(k, day) { return this.kall({ action: 'open', k, day }); },
  nullstill(k, day) { return this.kall({ action: 'resetTest', k, day }); },
};

/* Demo: etterligner serveren i nettleseren, slik at siden kan prøves uten oppsett.
   ?dag=8 viser hvordan kalenderen ser ut for en deltaker 8. desember. */
const DemoApi = (() => {
  const BELOP = Array.from({ length: ANTALL }, (_, i) => (i + 1) * 5);
  const ROT = ['hjul', 'skrapelodd', 'banditt', 'velgpakke', 'plinko', 'reinsdyr', 'memory'];
  const KALENDER = Array.from({ length: ANTALL }, (_, i) => (i === ANTALL - 1 ? 'pakkeapning' : ROT[i % ROT.length]));
  const p = new URLSearchParams(location.search);
  const hashDag = /^#dag-(\d+)$/.exec(location.hash || '');
  const simDag = p.has('dag') ? begrens(parseInt(p.get('dag'), 10) || 0, 0, ANTALL)
    : (hashDag ? begrens(parseInt(hashDag[1], 10), 0, ANTALL) : null);
  const nokkel = `julekalender.demo.${simDag === null ? 'test' : 'dag' + simDag}`;
  let tilstand = Lager.hent(nokkel, null);
  if (!tilstand) {
    tilstand = { trekk: {} };
    if (simDag) { // fyll inn noen åpnede luker, men la et par stå til gode
      const brukt = stokk(BELOP);
      for (let d = 1; d < simDag; d++) if (d % 4 !== 2) tilstand.trekk[d] = { amount: brukt.pop(), type: KALENDER[d - 1] };
    }
  }
  const lagre = () => Lager.sett(nokkel, tilstand);
  function status() {
    const erTest = simDag === null;
    const openDay = erTest ? ANTALL : simDag;
    let total = 0;
    const days = KALENDER.map((type, i) => {
      const dag = i + 1;
      const t = tilstand.trekk[dag];
      if (t) total += t.amount;
      return { day: dag, type: t ? t.type : (erTest || dag <= openDay ? type : null), opened: !!t, amount: t ? t.amount : null };
    });
    return { ok: true, name: 'Demo', isTest: erTest, demo: true, year: 2026, openDay, beforeStart: !erTest && openDay === 0, closed: false, opensAt: 0, now: '2026-12-01 12:00', days, total };
  }
  return {
    async status() { await vent(200); return status(); },
    async aapne(k, day) {
      await vent(tilfeldig(450, 1100));
      if (!tilstand.trekk[day]) {
        if (simDag !== null && day > simDag) throw new ApiFeil(`Luke ${day} åpner ${day}. desember.`, 'IKKE_AAPEN');
        const brukt = Object.values(tilstand.trekk).map((t) => t.amount);
        tilstand.trekk[day] = { amount: velg(BELOP.filter((b) => !brukt.includes(b))), type: KALENDER[day - 1] };
        lagre();
      }
      const s = status();
      return { ok: true, day, amount: tilstand.trekk[day].amount, total: s.total, status: s };
    },
    async nullstill(k, day) {
      await vent(200);
      if (day) delete tilstand.trekk[day]; else tilstand.trekk = {};
      lagre();
      return status();
    },
  };
})();

/* ---------- Bildefiler: data-URI-er gjøres om til blob-adresser (demo) ---- */
(function () {
  const b = window.JK_BILDER;
  if (!b) return;
  for (const [navn, url] of Object.entries(b)) {
    if (typeof url !== 'string' || !url.startsWith('data:')) continue;
    try {
      const [hode, data] = url.split(',');
      const mime = hode.slice(5).split(';')[0];
      const bytes = atob(data);
      const arr = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      b[navn] = URL.createObjectURL(new Blob([arr], { type: mime }));
    } catch (e) { /* behold data-URI */ }
  }
})();

function dobbelStrek(d, farge, bredde) {
  return `<path d="${d}" fill="none" stroke="${FARGE.strek}" stroke-width="${bredde + 4}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${farge}" stroke-width="${bredde}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function stjernePath(cx, cy, R, r, spisser = 5) {
  const pkt = [];
  for (let i = 0; i < spisser * 2; i++) {
    const v = -Math.PI / 2 + (i * Math.PI) / spisser;
    const rad = i % 2 === 0 ? R : r;
    pkt.push(`${(cx + rad * Math.cos(v)).toFixed(1)} ${(cy + rad * Math.sin(v)).toFixed(1)}`);
  }
  return `M${pkt.join(' L')} Z`;
}

function hattTransform(navn, x, y, w, rot) {
  return `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${(w / 100).toFixed(4)})`;
}

function hattBoks(navn, x, y, w, rot) {
  const [x1, y1, x2, y2] = HATTER[navn].boks;
  const k = w / 100;
  const c = Math.cos((rot * Math.PI) / 180);
  const s = Math.sin((rot * Math.PI) / 180);
  const pkt = [[x1, y1], [x2, y1], [x1, y2], [x2, y2]].map(([px, py]) => [x + k * (px * c - py * s), y + k * (px * s + py * c)]);
  return [Math.min(...pkt.map((p) => p[0])), Math.min(...pkt.map((p) => p[1])), Math.max(...pkt.map((p) => p[0])), Math.max(...pkt.map((p) => p[1]))];
}

function hattSvg(navn, x, y, w, rot) {
  if (!navn || !HATTER[navn]) return '';
  return `<g class="hatt hatt-${navn}" transform="${hattTransform(navn, x, y, w, rot)}">${HATTER[navn].svg}</g>`;
}

const DRAKTNAVN = Object.keys(DRAKTER);

/* ---------- Byggere -------------------------------------------------------- */

function lagSvg(innhold, viewBox, klasse = '', aria = '') {
  const tpl = document.createElement('template');
  tpl.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="${klasse}" viewBox="${viewBox}" ${aria ? `role="img" aria-label="${aria}"` : 'aria-hidden="true"'} overflow="visible">${innhold}</svg>`;
  return tpl.content.firstElementChild;
}

function bildeTag(navn, x, y, w, h) {
  return `<image href="${BILDE(navn)}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" preserveAspectRatio="none"/>`;
}

const NAVN = { han: 'han', hun: 'hun' };

/**
 * Hode alene, med valgfri lue/hodepynt og rød nese.
 * o: { hvem: 'han'|'hun', variant: 1|2, hatt, nese, klasse, tett (kvadratisk), fast (fast ramme) }
 */
function figurHode(o) {
  const navn = `${o.hvem}-hode-${o.variant || 2}`;
  const fd = FIGURDATA[navn];
  const h = fd.hoder[0];
  let boks = [0, 0, fd.w, fd.h];
  let innhold = bildeTag(navn, 0, 0, fd.w, fd.h);
  if (o.nese) innhold += neseSvg(h.nese.x, h.nese.y, h.nese.r * 1.35);
  if (o.hatt) {
    innhold += hattSvg(o.hatt, h.hatt.x, h.hatt.y, h.hatt.w, h.hatt.rot);
    const hb = hattBoks(o.hatt, h.hatt.x, h.hatt.y, h.hatt.w, h.hatt.rot);
    boks = [Math.min(boks[0], hb[0]), Math.min(boks[1], hb[1]), Math.max(boks[2], hb[2]), Math.max(boks[3], hb[3])];
  }
  if (o.fast) {
    // fast utsnitt rundt hodet (samme størrelse uansett lue), luer kan stikke utenfor
    boks = [-fd.w * 0.12, -fd.h * 0.62, fd.w * 1.12, fd.h];
  } else if (o.tett) {
    // kvadratisk utsnitt rundt ansiktet (til symboler og kort)
    const cx = h.hake.x - h.ansikt * 0.05;
    const top = boks[1];
    const side = Math.max(boks[3] - top, boks[2] - boks[0]) * 0.94;
    boks = [cx - side / 2, top, cx + side / 2, top + side];
  }
  const pad = (boks[2] - boks[0]) * 0.02;
  const vb = [boks[0] - pad, boks[1] - pad, boks[2] - boks[0] + 2 * pad, boks[3] - boks[1] + 2 * pad].map((v) => v.toFixed(1)).join(' ');
  return lagSvg(`<g class="hode">${innhold}</g>`, vb, `figur figur-hode ${o.klasse || ''}`);
}

/**
 * Figur i drakt: personens hode på en tegnet kropp.
 * o: { hvem, variant, drakt, hatt (null = ingen, undefined = draktens), nese, klasse }
 */
function figurDrakt(o) {
  const drakt = DRAKTER[o.drakt] || DRAKTER.nisse;
  const navn = `${o.hvem}-hode-${o.variant || 2}`;
  const fd = FIGURDATA[navn];
  const h = fd.hoder[0];
  const s = 112 / h.ansikt;
  const ix = 100 - h.hake.x * s;
  const iy = 156 - h.hake.y * s;
  const hatt = o.hatt === undefined ? drakt.hatt : o.hatt;
  const nese = o.nese === undefined ? !!drakt.nese : o.nese;
  const armer = drakt.armer === 'kvist'
    ? `<g class="arm arm-v kvist">${drakt.arm}</g><g class="arm arm-h kvist"><g transform="translate(200 0) scale(-1 1)">${drakt.arm}</g></g>`
    : `<g class="arm arm-v">${drakt.arm}</g><g class="arm arm-h"><g transform="translate(200 0) scale(-1 1)">${drakt.arm}</g></g>`;
  const innhold = `${drakt.bak || ''}<g class="kropp">${drakt.kropp}</g>${armer}
    <g class="hode">${bildeTag(navn, ix, iy, fd.w * s, fd.h * s)}${nese ? neseSvg(ix + h.nese.x * s, iy + h.nese.y * s, h.nese.r * s * 1.35) : ''}${hatt ? hattSvg(hatt, ix + h.hatt.x * s, iy + h.hatt.y * s, h.hatt.w * s, h.hatt.rot) : ''}</g>
    <g class="krage">${drakt.krage}</g>`;
  return lagSvg(innhold, '0 -70 200 378', `figur figur-drakt drakt-${o.drakt} ${o.klasse || ''}`);
}

/**
 * Fotofigur (utklipp fra illustrasjonene), med valgfrie luer.
 * o: { bilde: 'han-tommel'|'hun-armer'|'han-staende'|'hun-staende'|'par', hatter: [..per hode], neser: [..], klasse }
 */
function figurFoto(o) {
  const fd = FIGURDATA[o.bilde];
  let boks = [0, 0, fd.w, fd.h];
  let innhold = bildeTag(o.bilde, 0, 0, fd.w, fd.h);
  fd.hoder.forEach((h, i) => {
    const hatt = (o.hatter || [])[i];
    if ((o.neser || [])[i]) innhold += neseSvg(h.nese.x, h.nese.y, h.nese.r * 1.35);
    if (hatt) {
      innhold += hattSvg(hatt, h.hatt.x, h.hatt.y, h.hatt.w, h.hatt.rot);
      const hb = hattBoks(hatt, h.hatt.x, h.hatt.y, h.hatt.w, h.hatt.rot);
      boks = [Math.min(boks[0], hb[0]), Math.min(boks[1], hb[1]), Math.max(boks[2], hb[2]), Math.max(boks[3], hb[3])];
    }
  });
  const vb = [boks[0], boks[1], boks[2] - boks[0], boks[3] - boks[1]].map((v) => v.toFixed(1)).join(' ');
  return lagSvg(`<g class="hode">${innhold}</g>`, vb, `figur figur-foto ${o.klasse || ''}`);
}

/* ---------- Dagens kostymer -------------------------------------------------
   Hver dag får de to nye kostymer (aldri like), og hodene veksler mellom bildene. */

function dagensKostyme(dag, hvem) {
  const i = (dag * 4 + (hvem === 'hun' ? 5 : 0)) % DRAKTNAVN.length;
  return DRAKTNAVN[i];
}

function dagensHatt(dag, hvem) {
  const d = DRAKTER[dagensKostyme(dag, hvem)];
  return d.hatt || 'nisselue';
}

function dagensVariant(dag, hvem) {
  return ((dag + (hvem === 'hun' ? 1 : 0)) % 2) + 1;
}

function dagensFigur(dag, hvem, klasse = '') {
  return figurDrakt({ hvem, variant: dagensVariant(dag, hvem), drakt: dagensKostyme(dag, hvem), klasse });
}

function snakkeboble(tekst, klasse = '') {
  const el = document.createElement('div');
  el.className = `snakkeboble ${klasse}`;
  el.textContent = tekst;
  return el;
}

/* Lykkehjul: felt med gevinst og morsomme nitter. Hjulet lander alltid på gevinst,
   gjerne så vidt forbi en nitte. Vertskapet (dagens kostymer) jubler når det stopper. */
SPILL.hjul = {
  tittel: 'Lykkehjul',
  tekst: 'Snurr hjulet! Trykk på knappen eller sveip over hjulet.',
  start(ctx) {
    const N = 10;
    const SEG = 360 / N;
    const R = 140;
    const nitter = ['Ullsokker', 'Nesten!', 'Kull', 'Et eple', 'Grøt'];
    const rad = (g) => (g * Math.PI) / 180;
    let felt = '';
    for (let i = 0; i < N; i++) {
      const a0 = rad(i * SEG - 90);
      const a1 = rad((i + 1) * SEG - 90);
      const gevinst = i % 2 === 0;
      const farge = gevinst ? FARGE.gull : (i % 4 === 1 ? FARGE.rod : FARGE.gronn);
      const mid = i * SEG + SEG / 2;
      felt += `<path d="M0 0 L${(R * Math.cos(a0)).toFixed(2)} ${(R * Math.sin(a0)).toFixed(2)} A${R} ${R} 0 0 1 ${(R * Math.cos(a1)).toFixed(2)} ${(R * Math.sin(a1)).toFixed(2)} Z" fill="${farge}" stroke="${FARGE.strek}" stroke-width="2.5"/>`;
      if (gevinst) {
        felt += `<g transform="rotate(${mid})"><text y="-108" class="hjul__tekst hjul__tekst--gevinst">Gevinst</text>
          <g transform="translate(0 -80)"><rect x="-13" y="-9" width="26" height="20" rx="2" fill="${FARGE.rod}" stroke="${FARGE.strek}" stroke-width="2"/>
          <rect x="-15" y="-14" width="30" height="7" rx="2" fill="${FARGE.rodMork}" stroke="${FARGE.strek}" stroke-width="2"/>
          <rect x="-3" y="-14" width="6" height="25" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="1.5"/>
          <path d="M0 -14 C-8 -24 -16 -18 -8 -14 M0 -14 C8 -24 16 -18 8 -14" fill="none" stroke="${FARGE.strek}" stroke-width="2"/></g></g>`;
      } else {
        felt += `<g transform="rotate(${mid})"><text y="-98" class="hjul__tekst">${nitter[(i - 1) / 2]}</text></g>`;
      }
    }
    let paerer = '';
    for (let i = 0; i < N; i++) {
      const a = rad(i * SEG - 90);
      paerer += `<circle cx="${(147 * Math.cos(a)).toFixed(2)}" cy="${(147 * Math.sin(a)).toFixed(2)}" r="5" class="paere" />`;
    }
    const scene = ctx.scene;
    const hjul = el('div', { class: 'hjul' });
    hjul.innerHTML = `
      <div class="hjul__ramme">
        <svg class="hjul__skive" viewBox="-160 -160 320 320" aria-hidden="true">
          <circle r="156" fill="${FARGE.strek}"/>
          <circle r="152" fill="#3a2a1e"/>
          <g class="hjul__felt">${felt}<path class="hjul__treff" d="" /></g>
          ${paerer}
        </svg>
        <svg class="hjul__nav" viewBox="-40 -40 80 80" aria-hidden="true">
          <circle r="30" fill="${FARGE.rod}" stroke="${FARGE.strek}" stroke-width="3"/>
          <circle r="22" fill="none" stroke="${FARGE.gull}" stroke-width="3"/>
          <path d="${stjernePath(0, 1, 15, 6.5)}" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="2"/>
        </svg>
        <svg class="hjul__peker" viewBox="-22 -8 44 52" aria-hidden="true">
          <path d="M-16 0 L16 0 L0 38 Z" fill="${FARGE.rod}" stroke="${FARGE.strek}" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="4" r="6" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="2.5"/>
        </svg>
      </div>`;
    const vertV = dagensFigur(ctx.dag, 'han', 'vert vert--v');
    const vertH = dagensFigur(ctx.dag, 'hun', 'vert vert--h');
    hjul.append(vertV, vertH);
    scene.append(hjul);

    const felter = hjul.querySelector('.hjul__felt');
    const skive = hjul.querySelector('.hjul__skive');
    const peker = hjul.querySelector('.hjul__peker');
    let rot = tilfeldig(0, 360);
    felter.setAttribute('transform', `rotate(${rot.toFixed(2)})`);
    let snurrer = false;
    let stoppet = false;
    let kickStart = 0;
    const segUnder = (r) => Math.floor(((((-r) % 360) + 360) % 360) / SEG);

    const knapp = ctx.knapp('Snurr hjulet', snurr);

    function snurr() {
      if (snurrer || stoppet) return;
      snurrer = true;
      knapp.disabled = true;
      ctx.tekst('Det snurrer …');
      vertV.classList.add('dupp');
      vertH.classList.add('dupp');
      const g = velg([0, 2, 4, 6, 8]);
      const a = (g + 1) * SEG - tilfeldig(0.1, 0.3) * SEG; // lander så vidt inn i gevinstfeltet
      const start = rot;
      const min = start + 360 * (REDUSERT ? 1 : 5);
      const mal = Math.ceil((min + a) / 360) * 360 - a;
      let sist = segUnder(start);
      animer(REDUSERT ? 1200 : 5400, (e) => {
        rot = start + (mal - start) * e;
        felter.setAttribute('transform', `rotate(${rot.toFixed(2)})`);
        const s = segUnder(rot);
        if (s !== sist) { sist = s; kickStart = performance.now(); Lyd.tikk(); }
        const dt = performance.now() - kickStart;
        peker.style.transform = `rotate(${(-20 * Math.exp(-dt / 70)).toFixed(2)}deg)`;
      }, ease.utKvint).then(() => vant(g));
    }

    function vant(g) {
      stoppet = true;
      peker.style.transform = '';
      const a0 = rad(g * SEG - 90);
      const a1 = rad((g + 1) * SEG - 90);
      const treff = hjul.querySelector('.hjul__treff');
      treff.setAttribute('d', `M0 0 L${R * Math.cos(a0)} ${R * Math.sin(a0)} A${R} ${R} 0 0 1 ${R * Math.cos(a1)} ${R * Math.sin(a1)} Z`);
      skive.classList.add('vunnet');
      vertV.classList.remove('dupp');
      vertH.classList.remove('dupp');
      vertV.classList.add('jubel');
      vertH.classList.add('jubel');
      Lyd.pop();
      vibrer([20, 30, 20]);
      ctx.tekst('Gevinst!');
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1400);
    }

    // Sveip over hjulet for å snurre
    let sveip = null;
    skive.addEventListener('pointerdown', (e) => { sveip = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    skive.addEventListener('pointerup', (e) => {
      if (!sveip) return;
      const d = Math.hypot(e.clientX - sveip.x, e.clientY - sveip.y);
      if (d > 40 && performance.now() - sveip.t < 700) snurr();
      sveip = null;
    });
    return { stopp() { stoppet = true; } };
  },
};

/* Skrapelodd med symboler: tre like vinner. Blant symbolene er de to personene
   med dagens luer. Én av dem titter over kanten og jubler når loddet vinner. */
SPILL.skrapelodd = {
  tittel: 'Skrapelodd',
  tekst: 'Skrap fram tre like symboler med fingeren.',
  start(ctx) {
    const dag = ctx.dag;
    const symboler = ['🎄', '⭐', '🔔', '🍪', '☃️', '🦌', '🎁', '🕯️'].map((t) => ({ id: t, lag: () => el('span', { class: 'symbol', text: t }) }));
    ['han', 'hun'].forEach((hvem) => {
      const hatt = dagensHatt(dag + 3, hvem);
      symboler.push({ id: hvem, lag: () => figurHode({ hvem, variant: dagensVariant(dag, hvem), hatt, nese: hatt === 'gevir', tett: true, klasse: 'symbol symbol--ansikt' }) });
    });
    const ansikter = symboler.slice(-2);
    const vinner = Math.random() < 0.5 ? velg(ansikter) : velg(symboler.slice(0, 8));
    const andre = stokk(symboler.filter((s) => s !== vinner)).slice(0, 3);
    const rekke = stokk([vinner, vinner, vinner, ...andre, ...andre]);

    const titterHvem = dag % 2 ? 'hun' : 'han';
    const titterHatt = dagensHatt(dag, titterHvem);
    const titter = el('div', { class: 'lodd__titter' },
      figurHode({ hvem: titterHvem, variant: dagensVariant(dag + 1, titterHvem), hatt: titterHatt, nese: titterHatt === 'gevir', fast: true }),
      el('span', { class: 'vott vott--v' }), el('span', { class: 'vott vott--h' }));
    const felter = rekke.map((s) => el('div', { class: 'felt' }, s.lag()));
    const flate = el('div', { class: 'lodd__felt' }, ...felter);
    const lerret = el('canvas', { class: 'lodd__belegg', 'aria-label': 'Skrapefelt' });
    const omraade = el('div', { class: 'lodd__omraade' }, flate, lerret);
    const kort = el('div', { class: 'lodd__kort' },
      el('div', { class: 'lodd__topp' }, el('span', { class: 'lodd__navn', text: 'Julelodd' }), el('span', { class: 'lodd__regel', text: 'Tre like vinner' })),
      omraade,
      el('div', { class: 'lodd__bunn', text: `Trekning ${dag}. desember` }));
    const lodd = el('div', { class: 'lodd' }, titter, kort);
    ctx.scene.append(lodd);

    const avdekket = new Set();
    let ferdig = false;
    let dpr = 1;
    let W = 0;
    let H = 0;
    const g = lerret.getContext('2d', { willReadFrequently: true });

    function tegnBelegg() {
      const r = omraade.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = Math.round(r.width * dpr);
      H = Math.round(r.height * dpr);
      lerret.width = W;
      lerret.height = H;
      const grad = g.createLinearGradient(0, 0, W, H);
      grad.addColorStop(0, '#dfe3ec');
      grad.addColorStop(0.45, '#a9b1c4');
      grad.addColorStop(1, '#e8ebf2');
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = grad;
      g.fillRect(0, 0, W, H);
      for (let i = 0; i < 420; i++) {
        g.fillStyle = `rgba(255,255,255,${Math.random() * 0.55})`;
        g.fillRect(Math.random() * W, Math.random() * H, 1.6 * dpr, 1.6 * dpr);
      }
      const cw = W / 3;
      const ch = H / 3;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = `${Math.round(ch * 0.3)}px serif`;
      for (let i = 0; i < 9; i++) {
        const cx = (i % 3) * cw + cw / 2;
        const cy = Math.floor(i / 3) * ch + ch / 2;
        g.fillStyle = 'rgba(80, 90, 120, .35)';
        g.fillText('❄', cx, cy);
        if (avdekket.has(i)) g.clearRect((i % 3) * cw, Math.floor(i / 3) * ch, cw, ch);
      }
      g.globalCompositeOperation = 'destination-out';
      g.lineCap = 'round';
      g.lineJoin = 'round';
      g.lineWidth = Math.min(cw, ch) * 0.42;
    }
    requestAnimationFrame(tegnBelegg);

    let forrige = null;
    let sistSjekk = 0;
    let sistLyd = 0;
    const punkt = (e) => {
      const r = lerret.getBoundingClientRect();
      return { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr };
    };
    lerret.addEventListener('pointerdown', (e) => {
      if (ferdig) return;
      lerret.setPointerCapture(e.pointerId);
      forrige = punkt(e);
      g.beginPath();
      g.arc(forrige.x, forrige.y, g.lineWidth / 2, 0, Math.PI * 2);
      g.fill();
      Lyd.start();
    });
    lerret.addEventListener('pointermove', (e) => {
      if (!forrige || ferdig) return;
      const p = punkt(e);
      g.beginPath();
      g.moveTo(forrige.x, forrige.y);
      g.lineTo(p.x, p.y);
      g.stroke();
      forrige = p;
      const n = performance.now();
      if (n - sistLyd > 90) { Lyd.skrap(); sistLyd = n; }
      if (n - sistSjekk > 110) { sjekk(); sistSjekk = n; }
    });
    const slipp = () => { if (forrige) { forrige = null; sjekk(); } };
    lerret.addEventListener('pointerup', slipp);
    lerret.addEventListener('pointercancel', slipp);

    function avdekk(i, stille = false) {
      if (avdekket.has(i)) return;
      avdekket.add(i);
      const cw = W / 3;
      const ch = H / 3;
      g.save();
      g.globalCompositeOperation = 'destination-out';
      g.fillRect((i % 3) * cw - 1, Math.floor(i / 3) * ch - 1, cw + 2, ch + 2);
      g.restore();
      felter[i].classList.add('avdekket');
      if (!stille) { Lyd.pop(); vibrer(10); }
    }

    function sjekk() {
      if (ferdig || !W) return;
      const data = g.getImageData(0, 0, W, H).data;
      const cw = W / 3;
      const ch = H / 3;
      for (let i = 0; i < 9; i++) {
        if (avdekket.has(i)) continue;
        let tomme = 0;
        let alle = 0;
        for (let sy = 0; sy < 10; sy++) {
          for (let sx = 0; sx < 10; sx++) {
            const x = Math.floor((i % 3) * cw + cw * (0.12 + 0.76 * (sx / 9)));
            const y = Math.floor(Math.floor(i / 3) * ch + ch * (0.12 + 0.76 * (sy / 9)));
            alle++;
            if (data[(y * W + x) * 4 + 3] < 60) tomme++;
          }
        }
        if (tomme / alle > 0.45) avdekk(i);
      }
      const vinnere = rekke.map((s, i) => (s === vinner ? i : -1)).filter((i) => i >= 0);
      if (vinnere.every((i) => avdekket.has(i))) seier(vinnere);
    }

    async function skrapAlt() {
      if (ferdig) return;
      alt.disabled = true;
      for (let i = 0; i < 9; i++) {
        if (ferdig) return;
        if (!avdekket.has(i)) { avdekk(i); await vent(REDUSERT ? 0 : 140); }
      }
      sjekk();
    }
    const alt = ctx.knapp('Skrap alt', skrapAlt, true);

    function seier(vinnere) {
      if (ferdig) return;
      ferdig = true;
      alt.disabled = true;
      for (let i = 0; i < 9; i++) avdekk(i, true);
      felter.forEach((f, i) => f.classList.add(vinnere.includes(i) ? 'vinner' : 'dempet'));
      titter.classList.add('jubel');
      titter.append(snakkeboble('Tre like!', 'lodd__boble'));
      Lyd.vinn();
      vibrer([20, 40, 20]);
      ctx.tekst('Tre like! Gevinst!');
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1500);
    }

    // Tegn på nytt bare når bredden faktisk endres (ikke når adresselinja på mobil skjules)
    let sistBredde = 0;
    const vedEndring = () => {
      const b = Math.round(omraade.getBoundingClientRect().width);
      if (b && Math.abs(b - sistBredde) > 2) { sistBredde = b; requestAnimationFrame(tegnBelegg); }
    };
    requestAnimationFrame(() => { sistBredde = Math.round(omraade.getBoundingClientRect().width); });
    window.addEventListener('resize', vedEndring);
    return { stopp() { ferdig = true; window.removeEventListener('resize', vedEndring); } };
  },
};

/* Enarmet banditt: tre hjul med julesymboler og de to personenes ansikter.
   Hjulene stopper ett etter ett – det siste litt etter de andre – og det blir alltid tre like. */
SPILL.banditt = {
  tittel: 'Enarmet banditt',
  tekst: 'Dra spaken ned, eller trykk på knappen.',
  start(ctx) {
    const dag = ctx.dag;
    const emoji = ['🎄', '🔔', '⭐', '🍪', '🎁', '🦌'];
    const symboler = emoji.map((t) => ({ id: t, lag: () => el('span', { class: 'symbol', text: t }) }));
    ['han', 'hun'].forEach((hvem, i) => {
      const hatt = dagensHatt(dag + 1 + i, hvem);
      symboler.push({ id: hvem, lag: () => figurHode({ hvem, variant: dagensVariant(dag + i, hvem), hatt, nese: hatt === 'gevir', tett: true, klasse: 'symbol symbol--ansikt' }) });
    });
    const vinner = Math.random() < 0.55 ? velg(symboler.slice(-2)) : velg(symboler.slice(0, 6));
    const RUNDER = 7;
    const K = symboler.length;

    const hjulRader = [0, 1, 2].map(() => {
      const rekke = stokk(symboler);
      const stripe = el('div', { class: 'stripe' });
      for (let r = 0; r < RUNDER; r++) rekke.forEach((s) => stripe.append(el('div', { class: 'celle' }, s.lag())));
      return { rekke, stripe, pos: Math.floor(Math.random() * K) + 1 };
    });
    const vindu = el('div', { class: 'banditt__vindu' },
      ...hjulRader.map((h) => el('div', { class: 'valse' }, h.stripe)),
      el('div', { class: 'banditt__linje' }));
    const brett = el('div', { class: 'banditt__brett' });
    const skap = el('div', { class: 'banditt__skap' },
      el('div', { class: 'banditt__skilt' }, el('span', { text: 'Julebanditten' })),
      vindu,
      el('div', { class: 'banditt__panel' }, el('span', { class: 'lampe' }), el('span', { class: 'lampe' }), el('span', { class: 'lampe' })),
      brett);
    const kule = el('div', { class: 'spak__kule', role: 'button', 'aria-label': 'Spaken, dra den ned' });
    const spak = el('div', { class: 'banditt__spak' }, el('div', { class: 'spak__fot' }), el('div', { class: 'spak__stang' }, kule));
    const hvem = dag % 2 ? 'hun' : 'han';
    const figur = dagensFigur(dag, hvem, 'banditt__figur');
    const maskin = el('div', { class: 'banditt' }, figur, skap, spak);
    ctx.scene.append(maskin);

    let H = 0;
    const settPos = (h) => { h.stripe.style.transform = `translateY(${(-(h.pos - 1) * H).toFixed(1)}px)`; };
    requestAnimationFrame(() => {
      H = vindu.querySelector('.celle').offsetHeight;
      hjulRader.forEach(settPos);
    });

    let startet = false;
    let stoppet = false;
    const knapp = ctx.knapp('Dra i spaken', trekk);

    async function trekk() {
      if (startet || stoppet) return;
      startet = true;
      knapp.disabled = true;
      Lyd.start();
      ctx.tekst('Hjulene snurrer …');
      spak.classList.add('dratt');
      Lyd.klonk();
      vibrer(15);
      setTimeout(() => spak.classList.remove('dratt'), 450);
      H = H || vindu.querySelector('.celle').offsetHeight;
      const varigheter = REDUSERT ? [400, 600, 800] : [1500, 2300, 3700];
      await Promise.all(hjulRader.map((h, i) => {
        const indeks = h.rekke.indexOf(vinner);
        const mal = (RUNDER - 2) * K + indeks;
        const start = h.pos;
        let sistP = start;
        return animer(varigheter[i], (e) => {
          h.pos = start + (mal - start) * e;
          settPos(h);
          const fart = Math.abs(h.pos - sistP);
          h.stripe.classList.toggle('uskarp', fart > 0.18);
          if (Math.floor(h.pos) !== Math.floor(sistP) && i === 2 && fart < 0.12) Lyd.tikk();
          sistP = h.pos;
        }, i === 2 ? ease.utKvint : ease.utKubisk).then(() => {
          h.pos = mal;
          settPos(h);
          h.stripe.classList.remove('uskarp');
          Lyd.klonk();
          vibrer(12);
        });
      }));
      if (stoppet) return;
      seier();
    }

    function seier() {
      stoppet = true;
      vindu.classList.add('gevinst');
      skap.classList.add('blinker');
      ctx.tekst('Tre like! Gevinst!');
      figur.classList.add('jubel');
      for (let i = 0; i < 14; i++) {
        const m = el('span', { class: 'mynt', style: { left: `${tilfeldig(18, 82)}%`, animationDelay: `${i * 70}ms` } });
        brett.append(m);
        Lyd.mynt(i * 0.07);
      }
      vibrer([20, 30, 20, 30, 20]);
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1700);
    }

    // Dra spaken ned med fingeren
    let dra = null;
    kule.addEventListener('pointerdown', (e) => { if (startet) return; dra = e.clientY; kule.setPointerCapture(e.pointerId); });
    kule.addEventListener('pointermove', (e) => {
      if (dra === null) return;
      const dy = begrens(e.clientY - dra, 0, 70);
      spak.style.setProperty('--dra', `${dy}px`);
      if (dy > 55) { dra = null; spak.style.removeProperty('--dra'); trekk(); }
    });
    const slipp = () => { dra = null; spak.style.removeProperty('--dra'); };
    kule.addEventListener('pointerup', slipp);
    kule.addEventListener('pointercancel', slipp);
    kule.addEventListener('click', trekk);
    return { stopp() { stoppet = true; } };
  },
};

/* Velg en pakke: tre pakker blandes, og den du velger har alltid gevinsten.
   Når lokket spretter av, hopper en av dem ut som en kasse-klovn med dagens lue. */
SPILL.velgpakke = {
  tittel: 'Velg en pakke',
  tekst: 'Følg med når pakkene blandes, og velg én.',
  start(ctx) {
    const dag = ctx.dag;
    const farger = [[FARGE.rod, FARGE.rodMork], [FARGE.gronn, FARGE.gronnMork], ['#3f4fb0', '#2b367e']];
    const pakkeSvg = ([lys, mork]) => `<svg viewBox="0 0 120 140" aria-hidden="true">
      <g class="pakke__kropp"><rect x="12" y="52" width="96" height="82" rx="6" fill="${lys}" stroke="${FARGE.strek}" stroke-width="3"/>
      <rect x="52" y="52" width="16" height="82" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="2.5"/>
      <path d="M22 64 L30 58" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round"/></g>
      <g class="pakke__lokk"><rect x="6" y="36" width="108" height="22" rx="5" fill="${mork}" stroke="${FARGE.strek}" stroke-width="3"/>
      <rect x="52" y="36" width="16" height="22" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="2.5"/>
      <path d="M60 36 C46 10 22 14 30 30 C34 38 50 38 60 36 Z M60 36 C74 10 98 14 90 30 C86 38 70 38 60 36 Z" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="60" cy="35" r="6" fill="${FARGE.gullMork}" stroke="${FARGE.strek}" stroke-width="2.5"/></g></svg>`;
    const pakker = farger.map((f, i) => el('button', { class: 'pakke', 'aria-label': `Pakke ${i + 1}`, html: pakkeSvg(f), disabled: true }));
    const rad = el('div', { class: 'pakker' }, ...pakker);
    ctx.scene.append(rad);

    const plass = [0, 1, 2]; // plass[pakke] = posisjon
    let steg = 0;
    const plasser = (loft = []) => pakker.forEach((p, i) => {
      p.style.transform = `translateX(${(plass[i] - 1) * steg}px) translateY(${loft[i] || 0}px)`;
    });
    requestAnimationFrame(() => { steg = rad.offsetWidth / 3; plasser(); });

    let ferdig = false;
    let blandet = false;
    const knapp = ctx.knapp('Bland pakkene', bland);

    async function bland() {
      if (blandet) return;
      blandet = true;
      knapp.disabled = true;
      Lyd.start();
      ctx.tekst('Følg med …');
      steg = rad.offsetWidth / 3;
      const antall = REDUSERT ? 2 : 8;
      for (let n = 0; n < antall; n++) {
        if (ferdig) return;
        const a = Math.floor(Math.random() * 3);
        let b = Math.floor(Math.random() * 2);
        if (b >= a) b++;
        const fraA = plass[a];
        const fraB = plass[b];
        const varighet = Math.max(170, 330 - n * 22);
        Lyd.tone(380 + n * 30, 0.06, 'triangle', 0.05);
        await animer(varighet, (e) => {
          plass[a] = fraA + (fraB - fraA) * e;
          plass[b] = fraB + (fraA - fraB) * e;
          const loft = [];
          loft[a] = -26 * Math.sin(Math.PI * e);
          loft[b] = 10 * Math.sin(Math.PI * e);
          plasser(loft);
        }, ease.innUt);
        plass[a] = fraB;
        plass[b] = fraA;
        plasser();
      }
      ctx.tekst('Velg en pakke!');
      knapp.remove();
      pakker.forEach((p, i) => { p.disabled = false; p.addEventListener('click', () => velgPakke(i), { once: true }); });
      pakker[plass.indexOf(1)].focus({ preventScroll: true });
    }

    async function velgPakke(i) {
      if (ferdig) return;
      ferdig = true;
      pakker.forEach((p, j) => { p.disabled = true; if (j !== i) p.classList.add('bort'); });
      const valgt = pakker[i];
      valgt.classList.add('valgt');
      const fra = plass[i];
      await animer(380, (e) => { plass[i] = fra + (1 - fra) * e; plasser(); }, ease.utKubisk);
      valgt.classList.add('rister');
      Lyd.tone(220, 0.25, 'triangle', 0.08);
      await vent(REDUSERT ? 50 : 700);
      valgt.classList.remove('rister');
      valgt.classList.add('apnet');
      Lyd.pop();
      // kasse-klovnen
      const hvem = dag % 2 ? 'han' : 'hun';
      const hatt = dagensHatt(dag, hvem);
      const klovn = el('div', { class: 'klovn' },
        el('div', { class: 'klovn__hode' }, figurHode({ hvem, variant: dagensVariant(dag, hvem), hatt, nese: hatt === 'gevir', fast: true })),
        el('div', { class: 'klovn__fjaer', html: '<svg viewBox="0 0 30 100" preserveAspectRatio="none" aria-hidden="true"><path d="M15 100 L4 90 L26 80 L4 70 L26 60 L4 50 L26 40 L4 30 L26 20 L4 10 L15 0" fill="none" stroke="#c9ccd8" stroke-width="5" stroke-linejoin="round"/></svg>' }));
      valgt.append(klovn);
      Lyd.boing();
      vibrer([15, 25, 15]);
      setTimeout(() => klovn.append(snakkeboble('Overraskelse!', 'klovn__boble')), 380);
      ctx.tekst('Gevinst i pakken!');
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1700);
    }
    const vedEndring = () => { steg = rad.offsetWidth / 3; plasser(); };
    window.addEventListener('resize', vedEndring);
    return { stopp() { ferdig = true; window.removeEventListener('resize', vedEndring); } };
  },
};

/* Plinko: en julekule (med et kjent ansikt) slippes gjennom pinnene og havner alltid
   i et gevinstfelt. Den andre titter fram nede i hjørnet og jubler. */
SPILL.plinko = {
  tittel: 'Plinko',
  tekst: 'Flytt kula dit du vil, og slipp den.',
  start(ctx) {
    const dag = ctx.dag;
    const RADER = 8;
    const X = (p) => 20 + p * 17.5; // p = 0 … 16 (halve feltbredder)
    const Y = (r) => 96 + r * 36;
    const KULE = 13;
    const PINNE = 4;
    const kuleHvem = dag % 2 ? 'han' : 'hun';
    const annen = kuleHvem === 'han' ? 'hun' : 'han';

    let pinner = '';
    for (let r = 0; r < RADER; r++) {
      for (let p = r % 2; p <= 16; p += 2) pinner += `<circle class="pinne" data-r="${r}" data-p="${p}" cx="${X(p)}" cy="${Y(r)}" r="${PINNE}"/>`;
    }
    let felt = '';
    for (let k = 0; k < 9; k++) {
      const x = X(2 * k) - 17.5;
      const gevinst = k % 2 === 0;
      felt += `<rect class="spor ${gevinst ? 'spor--gevinst' : ''}" data-k="${k}" x="${x + 1.5}" y="392" width="32" height="50" rx="4"/>`;
      felt += gevinst
        ? `<g transform="translate(${X(2 * k)} 424) scale(.62)"><rect x="-13" y="-9" width="26" height="20" rx="2" fill="${FARGE.rod}" stroke="${FARGE.strek}" stroke-width="2.4"/><rect x="-15" y="-15" width="30" height="7" rx="2" fill="${FARGE.rodMork}" stroke="${FARGE.strek}" stroke-width="2.4"/><rect x="-3" y="-15" width="6" height="26" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="1.8"/></g>`
        : `<text x="${X(2 * k)}" y="429" class="spor__nitte">–</text>`;
    }
    for (let k = 1; k < 9; k++) felt += `<rect x="${X(2 * k - 1) - 2}" y="384" width="4" height="60" rx="2" fill="#c7cdf2"/>`;

    // kula: julekule med ansiktet innenfor
    const fd = FIGURDATA[`${kuleHvem}-hode-2`].hoder[0];
    const sk = 25 / fd.ansikt;
    const bilde = `<image href="${BILDE(`${kuleHvem}-hode-2`)}" x="${(-fd.nese.x * sk).toFixed(2)}" y="${(-fd.nese.y * sk + 2).toFixed(2)}" width="${(FIGURDATA[`${kuleHvem}-hode-2`].w * sk).toFixed(2)}" height="${(FIGURDATA[`${kuleHvem}-hode-2`].h * sk).toFixed(2)}" clip-path="url(#plinko-klipp)"/>`;
    const brett = el('div', { class: 'plinko' });
    brett.innerHTML = `<svg class="plinko__brett" viewBox="0 0 320 452" aria-label="Plinko-brett">
        <defs><clipPath id="plinko-klipp"><circle r="${KULE - 1.5}"/></clipPath>
        <radialGradient id="plinko-kule" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".6" stop-color="${FARGE.rod}"/><stop offset="1" stop-color="#7a0f17"/></radialGradient></defs>
        <rect x="2" y="2" width="316" height="448" rx="18" fill="${'#262c66'}" stroke="${FARGE.gull}" stroke-width="3"/>
        <rect x="10" y="44" width="300" height="2" rx="1" fill="#3f478f"/>
        ${pinner}${felt}
        <g class="plinko__kule" transform="translate(${X(8)} 26)">
          <circle r="${KULE + 1.5}" fill="url(#plinko-kule)" stroke="${FARGE.strek}" stroke-width="2.5"/>
          ${bilde}
          <circle r="${KULE - 1.5}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
          <rect x="-5" y="${-KULE - 6}" width="10" height="6" rx="1.5" fill="${FARGE.gull}" stroke="${FARGE.strek}" stroke-width="2"/>
          <path d="M0 ${-KULE - 6} q-5 -7 0 -9 q5 2 0 9" fill="none" stroke="${FARGE.gullMork}" stroke-width="2"/>
        </g>
      </svg>`;
    const hatt = dagensHatt(dag, annen);
    const titter = el('div', { class: 'plinko__titter' }, figurHode({ hvem: annen, variant: dagensVariant(dag, annen), hatt, nese: hatt === 'gevir', fast: true }));
    brett.append(titter);
    ctx.scene.append(brett);

    const svg = brett.querySelector('svg');
    const kule = svg.querySelector('.plinko__kule');
    let p0 = 8;
    let slippet = false;
    let stoppet = false;
    const settKule = (x, y) => kule.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);

    // flytt kula langs toppen
    const tilP = (e) => {
      const r = svg.getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 320;
      return begrens(Math.round((x - 20) / 17.5 / 2) * 2, 2, 14);
    };
    let drar = false;
    svg.addEventListener('pointerdown', (e) => {
      if (slippet) return;
      const r = svg.getBoundingClientRect();
      if ((e.clientY - r.top) / r.height * 452 > 90) return;
      drar = true;
      svg.setPointerCapture(e.pointerId);
      p0 = tilP(e);
      settKule(X(p0), 26);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!drar || slippet) return;
      const p = tilP(e);
      if (p !== p0) { p0 = p; settKule(X(p0), 26); Lyd.tikk(); }
    });
    const slipp = () => { drar = false; };
    svg.addEventListener('pointerup', slipp);
    svg.addEventListener('pointercancel', slipp);

    const venstre = ctx.knapp('◀', () => { if (!slippet && p0 > 2) { p0 -= 2; settKule(X(p0), 26); Lyd.tikk(); } }, true);
    const knapp = ctx.knapp('Slipp kula', slippKula);
    const hoyre = ctx.knapp('▶', () => { if (!slippet && p0 < 14) { p0 += 2; settKule(X(p0), 26); Lyd.tikk(); } }, true);
    venstre.setAttribute('aria-label', 'Flytt kula til venstre');
    hoyre.setAttribute('aria-label', 'Flytt kula til høyre');

    function lagBane() {
      const mulige = [0, 4, 8, 12, 16].filter((m) => Math.abs(m - p0) <= RADER);
      for (let forsok = 0; forsok < 400; forsok++) {
        const mal = velg(mulige);
        const hoyreSteg = (RADER + (mal - p0)) / 2;
        const steg = stokk([...Array(hoyreSteg).fill(1), ...Array(RADER - hoyreSteg).fill(-1)]);
        const bane = [p0];
        let ok = true;
        for (const s of steg) {
          const n = bane[bane.length - 1] + s;
          if (n < 0 || n > 16) { ok = false; break; }
          bane.push(n);
        }
        if (ok) return bane;
      }
      return null;
    }

    async function slippKula() {
      if (slippet) return;
      slippet = true;
      [venstre, knapp, hoyre].forEach((b) => { b.disabled = true; });
      Lyd.start();
      ctx.tekst('Der går den …');
      const bane = lagBane() || [8, 7, 8, 7, 8, 7, 8, 7, 8];
      const fart = REDUSERT ? 0.35 : 1;
      // fritt fall til første pinne
      const y0 = Y(0) - PINNE - KULE;
      await animer(300 * fart, (e) => settKule(X(bane[0]), 26 + (y0 - 26) * e), (t) => t * t);
      for (let r = 0; r < RADER; r++) {
        if (stoppet) return;
        const pinne = svg.querySelector(`.pinne[data-r="${r}"][data-p="${bane[r]}"]`);
        if (pinne) { pinne.classList.remove('truffet'); void pinne.getBBox(); pinne.classList.add('truffet'); }
        Lyd.tikk();
        vibrer(5);
        const xa = X(bane[r]);
        const xb = X(bane[r + 1]);
        const ya = Y(r) - PINNE - KULE;
        const yb = r + 1 < RADER ? Y(r + 1) - PINNE - KULE : 412;
        await animer((r + 1 < RADER ? 175 : 320) * Math.pow(0.97, r) * fart, (e) => {
          const bue = r + 1 < RADER ? 15 : 8;
          settKule(xa + (xb - xa) * e, ya + (yb - ya) * e * e - bue * 4 * e * (1 - e));
        });
      }
      if (stoppet) return;
      const k = bane[RADER] / 2;
      Lyd.klonk();
      await animer(220, (e) => settKule(X(bane[RADER]), 412 + 6 * Math.sin(Math.PI * e)));
      svg.querySelector(`.spor[data-k="${k}"]`).classList.add('lyser');
      titter.classList.add('jubel');
      titter.append(snakkeboble('Gevinst!', 'plinko__boble snakkeboble--hoyre'));
      Lyd.pop();
      vibrer([20, 30, 20]);
      ctx.tekst('Rett i gevinstfeltet!');
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1400);
    }
    return { stopp() { stoppet = true; } };
  },
};

/* Reinsdyrløp: fire reinsdyr med ryttere (de to i dagens kostymer og to fjøsnisser).
   Reinsdyret du velger, vinner alltid – gjerne med et nesehår. */

  <path d="M${x - 4} 58 L${x - 5} 82 L${x + 4} 82 L${x + 5} 58 Z" fill="${FARGE.brun}" stroke="${FARGE.strek}" stroke-width="2.4" stroke-linejoin="round"/>

SPILL.reinsdyr = {
  tittel: 'Reinsdyrløp',
  tekst: 'Velg reinsdyret ditt, og start løpet.',
  start(ctx) {
    const dag = ctx.dag;
    const deltakere = [
      { navn: 'Lynet', rytter: () => dagensFigur(dag, 'han') },
      { navn: 'Komet', rytter: () => dagensFigur(dag, 'hun') },
      { navn: 'Snøball', rytter: () => fjosnisseSvg(FARGE.rod) },
      { navn: 'Pepper', rytter: () => fjosnisseSvg('#6b6f7a') },
    ];
    const rekkefolge = stokk([0, 1, 2, 3]);
    const bane = el('div', { class: 'lop__bane' }, el('div', { class: 'lop__mal', 'aria-hidden': 'true' }));
    const spor = rekkefolge.map((i, plass) => {
      const d = deltakere[i];
      const rytter = d.rytter();
      rytter.classList.add('rytter');
      const ekvipasje = el('div', { class: 'ekvipasje' }, rytter, el('div', { class: 'rein-holder', html: reinsdyrSvg() }));
      const knapp = el('button', { class: 'spor', 'aria-pressed': 'false', 'aria-label': `Velg ${d.navn}` },
        el('span', { class: 'spor__navn' }, el('b', { text: String(plass + 1) }), ' ', d.navn), ekvipasje);
      bane.append(knapp);
      return { ...d, knapp, ekvipasje, rytter, x: 0 };
    });
    const nedtelling = el('div', { class: 'lop__nedtelling', 'aria-live': 'assertive' });
    const blits = el('div', { class: 'lop__blits' });
    const lop = el('div', { class: 'lop' }, bane, nedtelling, blits);
    ctx.scene.append(lop);

    let valgt = -1;
    let startet = false;
    let stoppet = false;
    const knapp = ctx.knapp('Start løpet', startLop);
    knapp.disabled = true;
    spor.forEach((s, i) => s.knapp.addEventListener('click', () => {
      if (startet) return;
      valgt = i;
      spor.forEach((t, j) => { t.knapp.classList.toggle('valgt', j === i); t.knapp.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
      knapp.disabled = false;
      ctx.tekst(`Du har valgt ${s.navn}. Klar?`);
      Lyd.tikk();
    }));

    function fartsprofil(sterkSlutt) {
      const v = Array.from({ length: 7 }, (_, k) => (sterkSlutt ? 0.8 + k * 0.07 : 1) * tilfeldig(0.78, 1.22));
      const N = 200;
      const P = [0];
      for (let n = 1; n <= N; n++) {
        const u = n / N;
        const f = u * (v.length - 1);
        const k = Math.min(v.length - 2, Math.floor(f));
        const t = (1 - Math.cos((f - k) * Math.PI)) / 2;
        P.push(P[n - 1] + v[k] * (1 - t) + v[k + 1] * t);
      }
      return P.map((p) => p / P[N]);
    }
    const hentP = (P, u) => {
      if (u >= 1) return 1;
      const f = u * (P.length - 1);
      const k = Math.floor(f);
      return P[k] + (P[k + 1] - P[k]) * (f - k);
    };

    async function startLop() {
      if (startet || valgt < 0) return;
      startet = true;
      knapp.disabled = true;
      Lyd.start();
      ctx.tekst('Gjør dere klare …');
      for (const t of ['3', '2', '1', 'Kjør!']) {
        nedtelling.textContent = t;
        nedtelling.classList.remove('vis');
        void nedtelling.offsetWidth;
        nedtelling.classList.add('vis');
        Lyd.tone(t === 'Kjør!' ? 880 : 520, 0.16, 'square', 0.06);
        await vent(REDUSERT ? 120 : 620);
        if (stoppet) return;
      }
      nedtelling.textContent = '';
      ctx.tekst('Løpet er i gang!');
      lop.classList.add('i-gang');
      const varighet = REDUSERT ? 1.8 : 6.4;
      const tider = spor.map(() => varighet + tilfeldig(0, 0.7));
      const profiler = spor.map(() => fartsprofil(false));
      const andre = tider.filter((_, i) => i !== valgt);
      tider[valgt] = Math.min(...andre) - 0.07;
      // Den valgte skal ikke lede halvveis – spenningen skal vare
      for (let forsok = 0; forsok < 60; forsok++) {
        const p = fartsprofil(true);
        const midt = hentP(p, (varighet / 2) / tider[valgt]);
        const best = Math.max(...spor.map((_, i) => (i === valgt ? 0 : hentP(profiler[i], (varighet / 2) / tider[i]))));
        profiler[valgt] = p;
        if (midt < best) break;
      }
      const sporBredde = bane.clientWidth;
      const ekvB = spor[0].ekvipasje.offsetWidth;
      const malX = sporBredde - 26 - ekvB;
      const t0 = performance.now();
      let malfoto = false;
      await new Promise((ferdig) => {
        function ramme(n) {
          if (stoppet) { ferdig(); return; }
          const t = (n - t0) / 1000;
          spor.forEach((s, i) => {
            const u = t / tider[i];
            const p = u < 1 ? hentP(profiler[i], u) : 1 + Math.min(0.08, (t - tider[i]) * 0.06);
            s.ekvipasje.style.transform = `translateX(${(p * malX).toFixed(1)}px)`;
          });
          if (!malfoto && t >= tider[valgt]) {
            malfoto = true;
            blits.classList.add('blink');
            Lyd.stoy(0.12, 0.2, 5000);
          }
          if (t < Math.max(...tider) + 0.5) requestAnimationFrame(ramme); else ferdig();
        }
        requestAnimationFrame(ramme);
      });
      if (stoppet) return;
      lop.classList.remove('i-gang');
      const vinner = spor[valgt];
      vinner.knapp.classList.add('vinner');
      vinner.rytter.classList.add('jubel');
      vinner.knapp.append(el('span', { class: 'malfoto', text: 'Målfoto' }));
      ctx.tekst(`${vinner.navn} vant med et nesehår!`);
      Lyd.pop();
      vibrer([20, 30, 20]);
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1500);
    }
    return { stopp() { stoppet = true; } };
  },
};

/* Memory: finn seks par. Fire av parene er de to personene med ulik hodepynt. */
SPILL.memory = {
  tittel: 'Memory',
  tekst: 'Snu to og to kort, og finn alle parene.',
  start(ctx) {
    const dag = ctx.dag;
    const hatter = Object.keys(HATTER);
    const h = (k) => hatter[(dag * 3 + k * 2) % hatter.length];
    const motiver = [
      { id: 'a', lag: () => figurHode({ hvem: 'han', variant: 2, hatt: h(0), nese: h(0) === 'gevir', tett: true }) },
      { id: 'b', lag: () => figurHode({ hvem: 'hun', variant: 2, hatt: h(1), nese: h(1) === 'gevir', tett: true }) },
      { id: 'c', lag: () => figurHode({ hvem: 'han', variant: 1, hatt: h(2), nese: h(2) === 'gevir', tett: true }) },
      { id: 'd', lag: () => figurHode({ hvem: 'hun', variant: 1, hatt: h(3), nese: h(3) === 'gevir', tett: true }) },
      { id: 'e', lag: () => el('span', { class: 'symbol', text: '🎄' }) },
      { id: 'f', lag: () => el('span', { class: 'symbol', text: '⭐' }) },
    ];
    const kortstokk = stokk([...motiver, ...motiver]);
    let forsok = 0;
    let apne = [];
    let funnet = 0;
    let laast = false;
    let stoppet = false;
    const kort = kortstokk.map((m, i) => {
      const k = el('button', { class: 'kort', 'aria-label': `Kort ${i + 1}` },
        el('span', { class: 'kort__inner' }, el('span', { class: 'kort__bak' }), el('span', { class: 'kort__forside' }, m.lag())));
      k.addEventListener('click', () => snu(i));
      return { m, el: k, funnet: false };
    });
    ctx.scene.append(el('div', { class: 'memory' }, ...kort.map((k) => k.el)));

    function snu(i) {
      const k = kort[i];
      if (laast || stoppet || k.funnet || apne.includes(i)) return;
      Lyd.start();
      Lyd.tone(660, 0.05, 'triangle', 0.05);
      k.el.classList.add('snudd');
      apne.push(i);
      if (apne.length < 2) return;
      forsok++;
      const [a, b] = apne.map((j) => kort[j]);
      if (a.m.id === b.m.id) {
        a.funnet = b.funnet = true;
        setTimeout(() => { a.el.classList.add('funnet'); b.el.classList.add('funnet'); Lyd.pop(); vibrer(12); }, 250);
        apne = [];
        funnet++;
        ctx.tekst(`Par! ${funnet} av 6 funnet.`);
        if (funnet === 6) ferdig();
      } else {
        laast = true;
        ctx.tekst(`Ikke likt. Forsøk nr. ${forsok}.`);
        setTimeout(() => {
          a.el.classList.remove('snudd');
          b.el.classList.remove('snudd');
          apne = [];
          laast = false;
        }, REDUSERT ? 300 : 850);
      }
    }

    function ferdig() {
      stoppet = true;
      ctx.tekst(`Alle parene på ${forsok} forsøk!`);
      kort.forEach((k, i) => setTimeout(() => k.el.classList.add('bolge'), i * 60));
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1500);
    }
    return { stopp() { stoppet = true; } };
  },
};

/* Pakkeåpning på julaften: riv av gavepapiret. Når pakken åpnes,
   spretter begge opp i julestas – han som julenisse, hun som engel – med «God jul!». */
SPILL.pakkeapning = {
  tittel: 'Pakkeåpning',
  tekst: 'Riv av gavepapiret med fingeren.',
  start(ctx) {
    const RAD = 4;
    const biter = [];
    const papir = el('div', { class: 'papir' });
    for (let r = 0; r < RAD; r++) {
      for (let c = 0; c < RAD; c++) {
        const b = el('span', { class: 'bit' });
        papir.append(b);
        biter.push({ el: b, r, c, revet: false });
      }
    }
    const sloyfe = el('div', { class: 'storsloyfe', html: `<svg viewBox="-60 -50 120 70" aria-hidden="true">${HATTER.sloyfe.svg}</svg>` });
    const indre = el('div', { class: 'indre' }, el('div', { class: 'indre__kropp' }), el('div', { class: 'indre__lokk' }));
    const utspring = el('div', { class: 'utspring' });
    const gave = el('div', { class: 'storgave' }, indre, utspring, papir,
      el('div', { class: 'band band--v' }), el('div', { class: 'band band--h' }), sloyfe);
    ctx.scene.append(gave);

    let revet = 0;
    let ferdig = false;
    let stoppet = false;

    function riv(b, stille = false) {
      if (b.revet) return;
      b.revet = true;
      revet++;
      const dx = (b.c - 1.5) * tilfeldig(60, 120);
      const dy = (b.r - 1.5) * tilfeldig(40, 100) - tilfeldig(40, 120);
      b.el.style.setProperty('--dx', `${dx}px`);
      b.el.style.setProperty('--dy', `${dy}px`);
      b.el.style.setProperty('--rot', `${tilfeldig(-80, 80)}deg`);
      b.el.classList.add('revet');
      if (!stille) { Lyd.riv(); vibrer(8); }
      if (revet === 5) { gave.classList.add('band-borte'); Lyd.pop(); }
      if (revet >= 11 && !ferdig) aapne();
    }

    const bitVed = (e) => {
      const r = papir.getBoundingClientRect();
      const c = Math.floor(((e.clientX - r.left) / r.width) * RAD);
      const rr = Math.floor(((e.clientY - r.top) / r.height) * RAD);
      if (c < 0 || rr < 0 || c >= RAD || rr >= RAD) return null;
      return biter[rr * RAD + c];
    };
    let drar = false;
    gave.addEventListener('pointerdown', (e) => {
      if (ferdig) return;
      drar = true;
      gave.setPointerCapture(e.pointerId);
      Lyd.start();
      const b = bitVed(e);
      if (b) riv(b);
    });
    gave.addEventListener('pointermove', (e) => {
      if (!drar || ferdig) return;
      const b = bitVed(e);
      if (b) riv(b);
    });
    const slipp = () => { drar = false; };
    gave.addEventListener('pointerup', slipp);
    gave.addEventListener('pointercancel', slipp);

    const knapp = ctx.knapp('Riv alt', async () => {
      knapp.disabled = true;
      for (const b of stokk(biter)) {
        if (ferdig || stoppet) break;
        riv(b);
        await vent(REDUSERT ? 0 : 90);
      }
    }, true);

    async function aapne() {
      ferdig = true;
      knapp.disabled = true;
      gave.classList.add('band-borte');
      for (const b of biter) { if (!b.revet) { riv(b, true); await vent(REDUSERT ? 0 : 50); } }
      ctx.tekst('Hva er det i pakken?');
      await vent(REDUSERT ? 50 : 650);
      if (stoppet) return;
      gave.classList.add('apnet');
      Lyd.pop();
      const han = figurDrakt({ hvem: 'han', variant: 2, drakt: 'nisse', klasse: 'spretter spretter--v' });
      const hun = figurDrakt({ hvem: 'hun', variant: 2, drakt: 'engel', klasse: 'spretter spretter--h' });
      const banner = el('div', { class: 'julebanner', text: 'God jul!' });
      utspring.append(han, hun);
      gave.append(banner);
      Lyd.boing();
      vibrer([20, 40, 20]);
      await vent(REDUSERT ? 50 : 700);
      han.classList.add('jubel');
      hun.classList.add('jubel');
      ctx.tekst('God jul!');
      setTimeout(() => { if (ctx.aktiv()) ctx.vunnet(); }, REDUSERT ? 300 : 1900);
    }
    return { stopp() { stoppet = true; ferdig = true; } };
  },
};
